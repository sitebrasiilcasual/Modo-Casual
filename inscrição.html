<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Inscrição</title>

<style>

body{
font-family:Arial;
background:#000;
color:#fff;
text-align:center;
padding:25px
}

.card{
max-width:600px;
margin:auto;
background:#111;
border:1px solid #ff8c00;
border-radius:14px;
padding:25px
}

h1{
color:#ff8c00
}

input{
width:100%;
padding:14px;
margin:6px 0;
border-radius:10px;
border:none;
background:#222;
color:#fff
}

button{
width:100%;
padding:14px;
margin-top:12px;
border:none;
border-radius:10px;
background:#ff8c00;
font-weight:bold;
font-size:16px
}

.msg{
margin-top:15px;
font-weight:bold
}

.barra{
width:100%;
height:12px;
background:#333;
border-radius:20px;
overflow:hidden;
margin-bottom:20px
}

.progresso{
height:100%;
width:0%;
background:#ff8c00;
transition:.4s
}

</style>
</head>

<body>

<div class="card">

<h1>Inscrição da Personalizada</h1>

<p id="vagas">Carregando vagas...</p>

<div class="barra">
<div id="barra" class="progresso"></div>
</div>

<form id="form">

<input id="time" placeholder="Nome do Time" required>

<input id="whatsapp" placeholder="Whatsapp do Capitão" required>

<input id="i1" placeholder="Integrante 1" required>

<input id="i2" placeholder="Integrante 2" required>

<input id="i3" placeholder="Integrante 3">

<input id="i4" placeholder="Integrante 4">

<button type="submit">
Enviar inscrição
</button>

</form>

<div id="msg" class="msg"></div>

</div>

<script>

const API_URL="https://script.google.com/macros/s/AKfycbxDpXJcIFKBOZVnHmIeQHSmoWM5k7MJjk5_o1u6krutoygcZsvq1SaQKw8QZlrZu-Zi0A/exec"

async function vagas(){

const res=await fetch(API_URL)
const json=await res.json()

if(json.ok){

document.getElementById("vagas").innerText =
json.vagas_restantes+" vagas restantes de "+json.vagas_total

const porcentagem=(json.vagas_restantes/json.vagas_total)*100

document.getElementById("barra").style.width=
porcentagem+"%"

}

}

document.getElementById("form").addEventListener("submit",async e=>{

e.preventDefault()

const dados={
time:time.value,
whatsapp:whatsapp.value,
integrante1:i1.value,
integrante2:i2.value,
integrante3:i3.value,
integrante4:i4.value
}

const res=await fetch(API_URL,{
method:"POST",
body:JSON.stringify(dados)
})

const json=await res.json()

if(json.ok){

msg.innerText="Inscrição enviada!"

vagas()

form.reset()

}else{

msg.innerText=json.erro

}

})

vagas()

</script>

</body>
</html>
