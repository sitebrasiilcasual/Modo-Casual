<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Inscrição</title>

<style>
html,body{margin:0;padding:0;overflow-x:hidden;touch-action:pan-y}
*{box-sizing:border-box}

body{
font-family:Arial;
background:#000;
color:#fff;
text-align:center;
position:relative;
}

/* FUNDO */
body:before{
content:"";
position:fixed;
inset:0;
background:
radial-gradient(circle at 20% 20%,rgba(255,140,0,.13),transparent 35%),
radial-gradient(circle at 80% 30%,rgba(255,94,0,.1),transparent 30%),
linear-gradient(to bottom,rgba(32,12,0,.82),rgba(0,0,0,.96));
z-index:0;
}

/* BRASAS */
.embers{
position:fixed;
inset:0;
pointer-events:none;
overflow:hidden;
z-index:1;
}
.embers span{
position:absolute;
bottom:-20px;
width:4px;
height:4px;
border-radius:50%;
background:#ff8c00;
box-shadow:0 0 10px #ff6a00;
animation:e linear infinite;
opacity:.8;
}
@keyframes e{
0%{transform:translateY(0);opacity:0}
10%{opacity:.9}
100%{transform:translateY(-120vh) translateX(35px);opacity:0}
}

/* HEADER */
header{
background:rgba(20,10,0,.9);
border-bottom:2px solid #ff8c00;
height:88px;
display:flex;
align-items:center;
justify-content:center;
position:relative;
overflow:visible;
z-index:3;
}

.titulo-wrap{
position:relative;
display:inline-flex;
align-items:center;
justify-content:center;
padding:8px 18px;
filter:drop-shadow(0 0 10px rgba(255,120,0,.35)) drop-shadow(0 0 25px rgba(255,80,0,.25));
}
.titulo-wrap:before{
content:"";
position:absolute;
left:-5%;
right:-5%;
top:50%;
height:120%;
transform:translateY(-50%);
background:
radial-gradient(circle at 20% 50%,rgba(255,140,0,.22),transparent 22%),
radial-gradient(circle at 50% 40%,rgba(255,90,0,.18),transparent 30%),
radial-gradient(circle at 80% 50%,rgba(255,180,0,.18),transparent 22%);
filter:blur(18px);
z-index:0;
animation:auraFogo 2.4s ease-in-out infinite alternate;
}
@keyframes auraFogo{
0%{transform:translateY(-50%) scale(1)}
100%{transform:translateY(-50%) scale(1.06)}
}

.glitch{
position:relative;
z-index:3;
font-size:34px;
font-weight:900;
letter-spacing:3px;
text-transform:uppercase;
color:#fff4db;
line-height:1;
margin:0;
text-shadow:
0 0 4px #fff3d6,
0 0 8px #ffcf66,
0 0 16px #ff8c00,
0 0 28px #ff5a00,
0 0 52px #ff2a00;
animation:fogoMain .12s infinite alternate,tremer .9s infinite steps(2,end);
}
.glitch:before,.glitch:after{
content:attr(data-text);
position:absolute;
left:0;
top:0;
width:100%;
overflow:hidden;
pointer-events:none;
}
.glitch:before{
color:rgba(255,60,0,.85);
z-index:-1;
transform:translate(-2px,-1px);
text-shadow:
0 0 8px #ff2a00,
0 0 18px #ff5a00,
0 0 30px #ff8c00;
animation:glitchLeft .18s infinite steps(2,end);
}
.glitch:after{
color:rgba(255,200,80,.9);
z-index:-1;
transform:translate(2px,1px);
text-shadow:
0 0 8px #ffae00,
0 0 18px #ff8c00,
0 0 34px #ff4500;
animation:glitchRight .14s infinite steps(2,end);
}

.fogo-topo{
position:absolute;
left:50%;
top:50%;
transform:translate(-50%,-58%);
width:115%;
height:95%;
pointer-events:none;
z-index:2;
filter:blur(1.2px) saturate(1.25);
}
.fogo-topo span{
position:absolute;
bottom:18%;
width:16%;
border-radius:50% 50% 45% 45%;
background:linear-gradient(to top,rgba(255,60,0,.96),rgba(255,140,0,.92),rgba(255,220,140,.28),transparent);
box-shadow:0 0 14px rgba(255,100,0,.7),0 0 28px rgba(255,140,0,.45);
transform-origin:center bottom;
animation:subirChama ease-in-out infinite alternate;
}
.fogo-topo span:nth-child(1){left:2%;height:40px;animation-duration:1.0s}
.fogo-topo span:nth-child(2){left:12%;height:52px;animation-duration:.8s}
.fogo-topo span:nth-child(3){left:23%;height:42px;animation-duration:1.15s}
.fogo-topo span:nth-child(4){left:35%;height:62px;animation-duration:.95s}
.fogo-topo span:nth-child(5){left:48%;height:48px;animation-duration:1.1s}
.fogo-topo span:nth-child(6){left:59%;height:60px;animation-duration:.78s}
.fogo-topo span:nth-child(7){left:71%;height:44px;animation-duration:1.05s}
.fogo-topo span:nth-child(8){left:83%;height:54px;animation-duration:.9s}
@keyframes subirChama{
0%{transform:translateY(0) scaleY(.9) scaleX(.95) rotate(-2deg);opacity:.65}
100%{transform:translateY(-8px) scaleY(1.25) scaleX(1.08) rotate(2deg);opacity:.98}
}

.brasas-titulo{
position:absolute;
inset:-18px -24px -10px -24px;
pointer-events:none;
z-index:4;
}
.brasas-titulo i{
position:absolute;
bottom:10px;
width:5px;
height:5px;
border-radius:50%;
background:#ffb347;
box-shadow:0 0 10px #ff8c00,0 0 20px rgba(255,90,0,.85);
animation:brasasTitulo linear infinite;
}
.brasas-titulo i:nth-child(1){left:8%;animation-duration:1.8s;animation-delay:.1s}
.brasas-titulo i:nth-child(2){left:16%;animation-duration:2.2s;animation-delay:.4s}
.brasas-titulo i:nth-child(3){left:26%;animation-duration:1.7s;animation-delay:.2s}
.brasas-titulo i:nth-child(4){left:38%;animation-duration:2.4s;animation-delay:.7s}
.brasas-titulo i:nth-child(5){left:50%;animation-duration:1.9s;animation-delay:.3s}
.brasas-titulo i:nth-child(6){left:60%;animation-duration:2.5s;animation-delay:.5s}
.brasas-titulo i:nth-child(7){left:72%;animation-duration:1.6s;animation-delay:.1s}
.brasas-titulo i:nth-child(8){left:82%;animation-duration:2.2s;animation-delay:.6s}
.brasas-titulo i:nth-child(9){left:91%;animation-duration:1.75s;animation-delay:.2s}
@keyframes brasasTitulo{
0%{transform:translateY(0) translateX(0) scale(.7);opacity:0}
12%{opacity:1}
100%{transform:translateY(-38px) translateX(12px) scale(1.2);opacity:0}
}

.reflexo-fogo{
position:absolute;
left:8%;
right:8%;
bottom:-12px;
height:18px;
background:radial-gradient(ellipse at center,rgba(255,120,0,.42),rgba(255,80,0,.14),transparent 70%);
filter:blur(8px);
z-index:1;
animation:reflexoPulso 1.3s ease-in-out infinite alternate;
}
@keyframes reflexoPulso{
0%{opacity:.5;transform:scaleX(.96)}
100%{opacity:.95;transform:scaleX(1.04)}
}

@keyframes fogoMain{
0%{
text-shadow:0 0 4px #fff3d6,0 0 8px #ffcf66,0 0 16px #ff8c00,0 0 28px #ff5a00,0 0 52px #ff2a00;
filter:brightness(1)
}
100%{
text-shadow:0 0 5px #fff7ea,0 0 12px #ffd26c,0 0 24px #ff9a1f,0 0 40px #ff5a00,0 0 70px #ff1e00;
filter:brightness(1.08)
}
}
@keyframes glitchLeft{
0%{transform:translate(-2px,0)}
25%{transform:translate(-4px,-1px)}
50%{transform:translate(-1px,1px)}
75%{transform:translate(-3px,0)}
100%{transform:translate(-2px,-1px)}
}
@keyframes glitchRight{
0%{transform:translate(2px,0)}
25%{transform:translate(5px,1px)}
50%{transform:translate(1px,-1px)}
75%{transform:translate(3px,0)}
100%{transform:translate(2px,1px)}
}
@keyframes tremer{
0%{transform:translate(0,0)}
25%{transform:translate(.6px,-.3px)}
50%{transform:translate(-.6px,.3px)}
75%{transform:translate(.4px,.2px)}
100%{transform:translate(0,0)}
}

/* CONTEÚDO */
.wrap{
max-width:620px;
margin:auto;
padding:20px;
position:relative;
z-index:3;
}
.card{
background:rgba(17,17,17,.9);
border:1px solid rgba(255,122,0,.35);
border-radius:12px;
padding:20px;
box-shadow:0 0 30px rgba(255,122,0,.08);
}
.info{
background:#1d0d00;
padding:12px;
border-radius:10px;
margin-bottom:14px;
border:1px solid rgba(255,122,0,.16);
line-height:1.7;
}
.contador{
margin-bottom:14px;
padding:14px;
border-radius:12px;
background:rgba(255,140,0,.08);
border:1px solid rgba(255,140,0,.2);
font-size:20px;
font-weight:bold;
}
.contador span{
color:#ffb347;
font-size:28px;
text-shadow:0 0 10px rgba(255,140,0,.5);
}
input,textarea,button{
width:100%;
padding:12px;
margin:7px 0;
border:none;
border-radius:8px;
font-size:16px;
}
input,textarea{
background:#1a1a1a;
color:#fff;
}
button{
background:#ff8c00;
color:#000;
font-weight:bold;
cursor:pointer;
}
button:disabled{
opacity:.6;
cursor:not-allowed;
}
.msg{
display:none;
color:#ff6b6b;
margin-top:10px;
font-weight:bold;
}
#erroBox{
margin-top:12px;
}
.ok{
display:none;
color:#7dff9a;
margin-top:12px;
font-weight:bold;
}

@media(max-width:600px){
header{height:82px}
.glitch{font-size:26px;letter-spacing:2px}
.fogo-topo{width:120%;height:88%}
}
</style>
</head>
<body>

<div class="embers">
<span style="left:5%;animation-duration:9s"></span>
<span style="left:15%;animation-duration:11s"></span>
<span style="left:25%;animation-duration:8s"></span>
<span style="left:35%;animation-duration:12s"></span>
<span style="left:45%;animation-duration:9s"></span>
<span style="left:55%;animation-duration:10s"></span>
<span style="left:65%;animation-duration:11s"></span>
<span style="left:75%;animation-duration:9s"></span>
<span style="left:85%;animation-duration:12s"></span>
<span style="left:95%;animation-duration:10s"></span>
</div>

<header>
<div class="titulo-wrap">
<div class="fogo-topo">
<span></span><span></span><span></span><span></span>
<span></span><span></span><span></span><span></span>
</div>

<h1 id="titulo" class="glitch" data-text="ZONA CASUAL">ZONA CASUAL</h1>

<div class="brasas-titulo">
<i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i>
</div>

<div class="reflexo-fogo"></div>
</div>
</header>

<div class="wrap">
<div class="card">

<div class="info" id="infoTxt">
Preencha corretamente os dados do seu time para participar.
</div>

<div class="contador">
Vagas restantes: <span id="v">0</span> / <span id="totalTxt">0</span>
</div>

<form id="f" action="https://formspree.io/f/myknkqyb" method="POST">
<input type="text" name="Nome do Clã (Time)" placeholder="NOME DO CLÃ (TIME)" required>
<input type="text" name="Whatsapp do Líder" placeholder="CAPITÃO" required>
<input type="text" name="Integrante 1" placeholder="INTEGRANTE 1" required>
<input type="text" name="Integrante 2" placeholder="INTEGRANTE 2" required>
<input type="text" name="Integrante 3" placeholder="INTEGRANTE 3" required>
<input type="text" name="Integrante 4" placeholder="INTEGRANTE 4" required>
<input type="hidden" name="_subject" value="Nova inscrição - Zona Casual">
<button id="enviar" type="submit">Enviar inscrição</button>
<div id="msg" class="msg">As vagas acabaram.</div>
<div id="okMsg" class="ok">Inscrição enviada com sucesso.</div>
</form>

<div id="erroBox" class="msg"></div>

</div>
</div>

<script>
let u=parseInt(localStorage.getItem("vagasUsadas")||0,10)
let T=12

function upd(){
let r=T-u
if(r<0) r=0

document.getElementById("v").innerText=r
document.getElementById("totalTxt").innerText=T

if(r<=0){
document.getElementById("enviar").disabled=true
document.getElementById("msg").style.display="block"
}else{
document.getElementById("enviar").disabled=false
document.getElementById("msg").style.display="none"
}
}

function mostrarErro(msg){
const box=document.getElementById("erroBox")
box.style.display="block"
box.textContent=msg
}

async function carregarDados(){
try{
const res=await fetch("dados.json?nocache="+Date.now())
if(!res.ok) throw new Error("Erro ao carregar dados.json")

const dados=await res.json()

const titulo=dados.titulo||"ZONA CASUAL"
const tituloEl=document.getElementById("titulo")
tituloEl.textContent=titulo
tituloEl.setAttribute("data-text",titulo)

document.title="Inscrição - "+titulo

if(dados.infoInscricao){
document.getElementById("infoTxt").innerHTML=dados.infoInscricao
}

if(dados.formAction){
document.getElementById("f").action=dados.formAction
}

if(dados.inscricao && dados.inscricao.totalVagas!=null){
T=parseInt(dados.inscricao.totalVagas,10)||12
}else if(dados.totalTimes!=null){
T=parseInt(dados.totalTimes,10)||12
}else{
T=12
}

let ocupadas=0
if(dados.inscricao && Array.isArray(dados.inscricao.times)){
ocupadas=dados.inscricao.times.length
}else if(dados.inscricao && dados.inscricao.vagasOcupadas!=null){
ocupadas=parseInt(dados.inscricao.vagasOcupadas,10)||0
}else if(dados.vagasOcupadas!=null){
ocupadas=parseInt(dados.vagasOcupadas,10)||0
}else{
ocupadas=parseInt(localStorage.getItem("vagasUsadas")||0,10)
}

u=ocupadas
localStorage.setItem("vagasUsadas",u)
upd()

}catch(e){
console.error(e)
T=12
upd()
mostrarErro("Erro ao carregar dados.json. A página usou valores padrão.")
}
}

document.getElementById("f").addEventListener("submit",function(e){
if(u>=T){
e.preventDefault()
upd()
return
}
})

window.addEventListener("DOMContentLoaded",carregarDados)
</script>

</body>
</html>
