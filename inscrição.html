<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Inscrição</title>

<style>
html,body{margin:0;padding:0;overflow-x:hidden;touch-action:pan-y}
*{box-sizing:border-box}

body{
font-family:Arial;
background:#000;
color:#fff;
text-align:center;
}

/* FUNDO */
body:before{
content:"";
position:fixed;
inset:0;
background:
radial-gradient(circle at 20% 20%,rgba(255,140,0,.13),transparent 35%),
radial-gradient(circle at 80% 30%,rgba(255,94,0,.1),transparent 30%),
linear-gradient(to bottom,rgba(32,12,0,.82),rgba(0,0,0,.96));
z-index:0;
}

/* BRASAS */
.embers{
position:fixed;
inset:0;
pointer-events:none;
overflow:hidden;
z-index:1;
}

.embers span{
position:absolute;
bottom:-20px;
width:4px;
height:4px;
border-radius:50%;
background:#ff8c00;
box-shadow:0 0 10px #ff6a00;
animation:e linear infinite;
opacity:.8;
}

@keyframes e{
0%{transform:translateY(0);opacity:0}
10%{opacity:.9}
100%{transform:translateY(-120vh) translateX(35px);opacity:0}
}

/* HEADER */
header{
background:rgba(20,8,0,.92);
border-bottom:2px solid #ff7a00;
height:64px;
display:flex;
align-items:center;
justify-content:center;
position:relative;
z-index:3;
}

/* MENU HAMBÚRGUER 2 LINHAS */
.menu-btn{
position:absolute;
left:15px;
top:50%;
transform:translateY(-50%);
background:none;
border:none;
cursor:pointer;
display:flex;
flex-direction:column;
gap:6px;
}

.menu-btn span{
display:block;
width:22px;
height:4px;
background:#fff;
border-radius:4px;
flex:0 0 auto;
}

/* SIDEBAR */
.sidebar{
position:fixed;
top:0;
left:-210px;
width:190px;
height:100%;
background:#120700;
padding-top:75px;
transition:.3s;
z-index:10;
border-right:1px solid rgba(255,122,0,.25);
}

.sidebar a{
display:block;
color:#fff;
text-decoration:none;
padding:12px;
text-align:left;
font-weight:bold;
line-height:1.4;
}

.sidebar.active{left:0}

/* OVERLAY */
.overlay{
position:fixed;
inset:0;
background:rgba(0,0,0,.6);
display:none;
z-index:9;
}
.overlay.active{display:block}

/* TÍTULO */
.glitch{
position:relative;
display:inline-block;
font-size:26px;
font-weight:900;
letter-spacing:1px;
text-transform:uppercase;
color:#fff;
animation:flick .25s infinite alternate;
line-height:1;
margin:0;
}

.glitch:before,
.glitch:after{
content:attr(data-text);
position:absolute;
left:0;
top:0;
width:100%;
overflow:hidden;
}

.glitch:before{
color:#ff7a00;
transform:translate(-2px,0);
text-shadow:-2px 0 #ff7a00;
animation:err1 1.2s infinite steps(1);
}

.glitch:after{
color:#ff9f43;
transform:translate(2px,0);
opacity:.6;
animation:err2 .9s infinite steps(1);
}

@keyframes flick{
0%{opacity:1}
10%{opacity:.4}
12%{opacity:1}
54%{opacity:.5}
56%{opacity:1}
100%{opacity:1}
}

@keyframes err1{
0%,100%{clip-path:inset(0 0 0 0)}
20%{clip-path:inset(60% 0 5% 0)}
40%{clip-path:inset(10% 0 80% 0)}
60%{clip-path:inset(45% 0 25% 0)}
80%{clip-path:inset(80% 0 5% 0)}
}

@keyframes err2{
0%,100%{clip-path:inset(0 0 0 0)}
25%{clip-path:inset(70% 0 8% 0)}
50%{clip-path:inset(18% 0 55% 0)}
75%{clip-path:inset(82% 0 3% 0)}
}

/* CONTEÚDO */
.wrap{
max-width:620px;
margin:auto;
padding:20px;
position:relative;
z-index:3;
}

.card{
background:rgba(17,17,17,.9);
border:1px solid rgba(255,122,0,.35);
border-radius:12px;
padding:20px;
box-shadow:0 0 30px rgba(255,122,0,.08);
}

.info{
background:#1d0d00;
padding:12px;
border-radius:10px;
margin-bottom:14px;
border:1px solid rgba(255,122,0,.16);
}

input,textarea,button{
width:100%;
padding:12px;
margin:7px 0;
border:none;
border-radius:8px;
box-sizing:border-box;
font-size:15px;
}

input,textarea{
background:#1a1a1a;
color:#fff;
border:1px solid rgba(255,122,0,.15);
outline:none;
}

input:focus,textarea:focus{
border-color:#ff7a00;
box-shadow:0 0 0 2px rgba(255,122,0,.12);
}

button{
background:linear-gradient(180deg,#ff8c00,#ff5e00);
color:#fff;
font-weight:bold;
cursor:pointer;
}

.vagas{
margin-top:14px;
background:#1d0d00;
border-radius:10px;
padding:12px;
border:1px solid rgba(255,122,0,.16);
}

.vagas b{font-size:28px}

footer{
padding:16px;
border-top:1px solid #ff7a00;
background:rgba(0,0,0,.4);
margin-top:16px;
position:relative;
z-index:3;
}

.erro-box{
margin-top:14px;
background:rgba(255,0,0,.08);
border:1px solid rgba(255,80,80,.35);
color:#ffd6d6;
border-radius:10px;
padding:12px;
display:none;
}

@media(max-width:700px){
.glitch{font-size:24px}
}
</style>
</head>

<body>

<div class="embers">
<span style="left:10%;animation-duration:9s"></span>
<span style="left:30%;animation-duration:11s"></span>
<span style="left:55%;animation-duration:8s"></span>
<span style="left:75%;animation-duration:12s"></span>
<span style="left:90%;animation-duration:9s"></span>
</div>

<div class="overlay" id="overlay" onclick="fecharMenu()"></div>

<div class="sidebar" id="side">
<a href="index.html">INÍCIO</a>
<a href="ademar.html">PORTAL ADM
<a href="inscricao.html">INSCRIÇÃO</a>
</div>

<header>
<button class="menu-btn" onclick="m()" aria-label="Abrir menu">
<span></span>
<span></span>
</button>

<h1 class="glitch" id="titulo" data-text="ZONA CASUAL">ZONA CASUAL</h1>
</header>

<div class="wrap">
<div class="card">

<div class="info" id="infoTxt">
<b>Somente o líder da equipe</b> deve fazer a inscrição.
</div>

<form id="f" action="https://formspree.io/f/myknkqyb" method="POST">
<input name="Equipe" placeholder="Nome da Equipe" required>
<input name="Lider" placeholder="Nome do Líder" required>
<input name="Whatsapp" placeholder="WhatsApp do Líder" required>
<input name="Jogador1" placeholder="Jogador 1" required>
<input name="Jogador2" placeholder="Jogador 2">
<input name="Jogador3" placeholder="Jogador 3">
<input name="Jogador4" placeholder="Jogador 4">
<textarea name="Observacoes" placeholder="Observações"></textarea>
<button id="enviar" type="submit">Enviar Inscrição</button>
</form>

<div class="vagas">
Vagas Disponíveis<br><br>
<b id="v">12</b> / <span id="totalTxt">12</span>
<div id="msg" style="display:none;color:#ff9b6b;margin-top:8px">Vagas esgotadas</div>
</div>

<div class="erro-box" id="erroBox"></div>

</div>
</div>

<footer>© 2026 Zona Casual</footer>

<script>
let T = 12;
let u = parseInt(localStorage.getItem("vagasUsadas") || "0", 10);

function m(){
  document.getElementById("side").classList.toggle("active");
  document.getElementById("overlay").classList.toggle("active");
}

function fecharMenu(){
  document.getElementById("side").classList.remove("active");
  document.getElementById("overlay").classList.remove("active");
}

function upd(){
  if(T < 1) T = 1;
  if(u < 0) u = 0;
  if(u > T) u = T;

  let r = T - u;
  if(r < 0) r = 0;

  document.getElementById("v").innerText = r;
  document.getElementById("totalTxt").innerText = T;

  if(r <= 0){
    document.getElementById("enviar").disabled = true;
    document.getElementById("enviar").style.opacity = ".6";
    document.getElementById("msg").style.display = "block";
  }else{
    document.getElementById("enviar").disabled = false;
    document.getElementById("enviar").style.opacity = "1";
    document.getElementById("msg").style.display = "none";
  }
}

function mostrarErro(msg){
  const box = document.getElementById("erroBox");
  box.style.display = "block";
  box.textContent = msg;
}

async function carregarDados(){
  try{
    const res = await fetch("dados.json?nocache=" + Date.now());
    if(!res.ok) throw new Error("Não foi possível carregar dados.json");
    const dados = await res.json();

    const titulo = dados.titulo || "ZONA CASUAL";
    const tituloEl = document.getElementById("titulo");
    tituloEl.textContent = titulo;
    tituloEl.setAttribute("data-text", titulo);

    if(dados.inscricao){
      document.title = dados.inscricao.pageTitle || "Inscrição";
      document.getElementById("infoTxt").innerHTML =
        dados.inscricao.infoTexto || "<b>Somente o líder da equipe</b> deve fazer a inscrição.";

      if(dados.inscricao.formAction){
        document.getElementById("f").action = dados.inscricao.formAction;
      }

      T = parseInt(dados.inscricao.totalTimes || 12, 10);
    }else{
      T = 12;
    }

    upd();
  }catch(e){
    console.error(e);
    T = 12;
    upd();
    mostrarErro("Erro ao carregar dados.json. A página usou os valores padrão.");
  }
}

document.getElementById("f").addEventListener("submit", function(e){
  if(u >= T){
    e.preventDefault();
    upd();
    return;
  }

  u++;
  localStorage.setItem("vagasUsadas", u);
});

window.addEventListener("DOMContentLoaded", carregarDados);
</script>

</body>
</html>
