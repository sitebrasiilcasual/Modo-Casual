<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Inscrição</title>

<style>
html,body{margin:0;padding:0;overflow-x:hidden;touch-action:pan-y}
*{box-sizing:border-box}

body{
font-family:Arial;
background:#000;
color:#fff;
text-align:center;
}

/* FUNDO */
body:before{
content:"";
position:fixed;
inset:0;
background:
radial-gradient(circle at 20% 20%,rgba(255,60,0,.1),transparent 35%),
radial-gradient(circle at 80% 30%,rgba(255,0,0,.08),transparent 30%),
linear-gradient(to bottom,rgba(20,0,0,.8),rgba(0,0,0,.95));
z-index:0;
}

/* BRASAS */
.embers{
position:fixed;
inset:0;
pointer-events:none;
overflow:hidden;
z-index:1;
}

.embers span{
position:absolute;
bottom:-20px;
width:4px;
height:4px;
border-radius:50%;
background:#ff5a1f;
box-shadow:0 0 10px #ff3c00;
animation:e linear infinite;
opacity:.8;
}

@keyframes e{
0%{transform:translateY(0);opacity:0}
10%{opacity:.9}
100%{transform:translateY(-120vh) translateX(35px);opacity:0}
}

/* HEADER */
header{
background:rgba(11,0,0,.9);
border-bottom:2px solid #ff0000;
height:64px;
display:flex;
align-items:center;
justify-content:center;
position:relative;
z-index:3;
}

/* MENU HAMBÚRGUER 2 LINHAS */
.menu-btn{
position:absolute;
left:18px;
top:50%;
transform:translateY(-50%);
width:30px;
height:22px;
padding:0;
margin:0;
border:none;
outline:none;
background:transparent;
appearance:none;
-webkit-appearance:none;
display:flex;
flex-direction:column;
justify-content:space-between;
align-items:flex-start;
cursor:pointer;
}

.menu-btn span{
display:block;
width:22px;
height:4px;
background:#fff;
border-radius:4px;
flex:0 0 auto;
}

/* SIDEBAR */
.sidebar{
position:fixed;
top:0;
left:-210px;
width:190px;
height:100%;
background:#0b0000;
padding-top:75px;
transition:.3s;
z-index:10;
}

.sidebar a{
display:block;
color:#fff;
text-decoration:none;
padding:12px;
text-align:left;
font-weight:bold;
}

.sidebar.active{left:0}

/* TÍTULO - IGUAL AO INDEX */
.glitch{
position:relative;
display:inline-block;
font-size:26px;
font-weight:900;
letter-spacing:1px;
text-transform:uppercase;
color:#fff;
animation:flick .25s infinite alternate;
line-height:1;
margin:0;
}

.glitch:before,
.glitch:after{
content:attr(data-text);
position:absolute;
left:0;
top:0;
width:100%;
overflow:hidden;
}

.glitch:before{
color:#ff0000;
transform:translate(-2px,0);
text-shadow:-2px 0 #ff0000;
animation:err1 1.2s infinite steps(1);
}

.glitch:after{
color:#ff0000;
transform:translate(2px,0);
opacity:.6;
animation:err2 .9s infinite steps(1);
}

@keyframes flick{
0%{opacity:1}
10%{opacity:.4}
12%{opacity:1}
54%{opacity:.5}
56%{opacity:1}
100%{opacity:1}
}

@keyframes err1{
0%,100%{clip-path:inset(0 0 0 0)}
20%{clip-path:inset(60% 0 5% 0)}
40%{clip-path:inset(10% 0 80% 0)}
60%{clip-path:inset(45% 0 25% 0)}
80%{clip-path:inset(80% 0 5% 0)}
}

@keyframes err2{
0%,100%{clip-path:inset(0 0 0 0)}
25%{clip-path:inset(70% 0 8% 0)}
50%{clip-path:inset(18% 0 55% 0)}
75%{clip-path:inset(82% 0 3% 0)}
}

/* CONTEÚDO */
.wrap{
max-width:620px;
margin:auto;
padding:20px;
position:relative;
z-index:3;
}

.card{
background:rgba(17,17,17,.9);
border:1px solid rgba(255,0,0,.3);
border-radius:12px;
padding:20px;
}

.info{
background:#1a0000;
padding:12px;
border-radius:10px;
margin-bottom:14px;
}

input,textarea,button{
width:100%;
padding:12px;
margin:7px 0;
border:none;
border-radius:8px;
box-sizing:border-box;
}

input,textarea{
background:#1a1a1a;
color:#fff;
}

button{
background:#ff0000;
color:#fff;
font-weight:bold;
cursor:pointer;
}

.vagas{
margin-top:14px;
background:#1a0000;
border-radius:10px;
padding:12px;
}

.vagas b{font-size:28px}

footer{
padding:16px;
border-top:1px solid #ff0000;
background:rgba(0,0,0,.4);
margin-top:16px;
position:relative;
z-index:3;
}

/* ADMIN */
.admin-btn{
position:fixed;
right:18px;
bottom:18px;
width:54px;
height:54px;
border:none;
border-radius:50%;
background:#ff0000;
color:#fff;
font-size:22px;
z-index:20;
}

.admin{
position:fixed;
inset:0;
background:rgba(0,0,0,.96);
display:none;
padding:20px;
overflow:auto;
z-index:30;
}

.admin-box{
max-width:420px;
margin:auto;
background:#111;
padding:18px;
border-radius:12px;
border:1px solid rgba(255,0,0,.25);
}

.close{
background:#333;
}

@media(max-width:700px){
.glitch{font-size:24px}
}
</style>
</head>

<body>

<div class="embers">
<span style="left:10%;animation-duration:9s"></span>
<span style="left:30%;animation-duration:11s"></span>
<span style="left:55%;animation-duration:8s"></span>
<span style="left:75%;animation-duration:12s"></span>
<span style="left:90%;animation-duration:9s"></span>
</div>

<div class="sidebar" id="side">
<a href="index.html">INÍCIO</a>
<a href="inscricao.html">INSCRIÇÃO</a>
</div>

<header>
<button class="menu-btn" onclick="m()" aria-label="Abrir menu">
<span></span>
<span></span>
</button>

<h1 class="glitch" data-text="ZONA CASUAL">ZONA CASUAL</h1>
</header>

<div class="wrap">
<div class="card">

<div class="info">
<b>Somente o líder da equipe</b> deve fazer a inscrição.
</div>

<form id="f" action="https://formspree.io/f/myknkqyb" method="POST">
<input name="Equipe" placeholder="Nome da Equipe" required>
<input name="Lider" placeholder="Nome do Líder" required>
<input name="Whatsapp" placeholder="WhatsApp do Líder" required>
<input name="Jogador1" placeholder="Jogador 1" required>
<input name="Jogador2" placeholder="Jogador 2">
<input name="Jogador3" placeholder="Jogador 3">
<input name="Jogador4" placeholder="Jogador 4">
<textarea name="Observacoes" placeholder="Observações"></textarea>
<button id="enviar" type="submit">Enviar Inscrição</button>
</form>

<div class="vagas">
Vagas Disponíveis<br><br>
<b id="v">12</b> / 12
<div id="msg" style="display:none;color:#ff7777;margin-top:8px">Vagas esgotadas</div>
</div>

</div>
</div>

<footer>© 2026 Zona Casual</footer>

<button class="admin-btn" onclick="abrirAdmin()">⚙</button>

<div class="admin" id="admin">
<div class="admin-box">

<div id="loginBox">
<input type="password" id="senha" placeholder="Senha">
<button onclick="login()">Entrar</button>
<button class="close" onclick="fecharAdmin()">Fechar</button>
</div>

<div id="painel" style="display:none">
<button onclick="resetarVagas()">Resetar Vagas</button>
<button class="close" onclick="fecharAdmin()">Fechar</button>
</div>

</div>
</div>

<script>
const T=12
let u=parseInt(localStorage.getItem("vagasUsadas")||"0",10)

function m(){
document.getElementById("side").classList.toggle("active")
}

function upd(){
let r=T-u
if(r<0)r=0
document.getElementById("v").innerText=r

if(r<=0){
document.getElementById("enviar").disabled=true
document.getElementById("enviar").style.opacity=".6"
document.getElementById("msg").style.display="block"
}else{
document.getElementById("enviar").disabled=false
document.getElementById("enviar").style.opacity="1"
document.getElementById("msg").style.display="none"
}
}

document.getElementById("f").addEventListener("submit",()=>{
if(u<T){
u++
localStorage.setItem("vagasUsadas",u)
}
})

function abrirAdmin(){
document.getElementById("admin").style.display="block"
}

function fecharAdmin(){
document.getElementById("admin").style.display="none"
}

function login(){
if(document.getElementById("senha").value==="senha1326"){
document.getElementById("loginBox").style.display="none"
document.getElementById("painel").style.display="block"
}else{
alert("Senha incorreta")
}
}

function resetarVagas(){
u=0
localStorage.setItem("vagasUsadas","0")
upd()
alert("Vagas resetadas")
}

upd()
</script>

</body>
</html>
