<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Inscrição</title>

<style>
html,body{margin:0;padding:0;overflow-x:hidden;touch-action:pan-y}
*{box-sizing:border-box}

body{
font-family:Arial;
background:#000;
color:#fff;
text-align:center;
}

/* FUNDO */
body:before{
content:"";
position:fixed;
inset:0;
background:
radial-gradient(circle at 20% 20%,rgba(255,140,0,.13),transparent 35%),
radial-gradient(circle at 80% 30%,rgba(255,94,0,.1),transparent 30%),
linear-gradient(to bottom,rgba(32,12,0,.82),rgba(0,0,0,.96));
z-index:0;
}

/* BRASAS */
.embers{
position:fixed;
inset:0;
pointer-events:none;
overflow:hidden;
z-index:1;
}

.embers span{
position:absolute;
bottom:-20px;
width:4px;
height:4px;
border-radius:50%;
background:#ff8c00;
box-shadow:0 0 10px #ff6a00;
animation:e linear infinite;
opacity:.8;
}

@keyframes e{
0%{transform:translateY(0);opacity:0}
10%{opacity:.9}
100%{transform:translateY(-120vh) translateX(35px);opacity:0}
}

/* HEADER */
header{
background:rgba(20,8,0,.92);
border-bottom:2px solid #ff7a00;
height:88px;
display:flex;
align-items:center;
justify-content:center;
position:relative;
z-index:3;
overflow:visible
}

/* MENU HAMBÚRGUER 2 LINHAS */
.menu-btn{
position:absolute;
left:15px;
top:50%;
transform:translateY(-50%);
background:none;
border:none;
cursor:pointer;
display:flex;
flex-direction:column;
gap:6px;
z-index:12;
}

.menu-btn span{
display:block;
width:22px;
height:4px;
background:#fff;
border-radius:4px;
flex:0 0 auto;
}

/* SIDEBAR */
.sidebar{
position:fixed;
top:0;
left:-210px;
width:190px;
height:100%;
background:#120700;
padding-top:75px;
transition:.3s;
z-index:10;
border-right:1px solid rgba(255,122,0,.25);
}

.sidebar a{
display:block;
color:#fff;
text-decoration:none;
padding:12px;
text-align:left;
font-weight:bold;
line-height:1.4;
}

.sidebar.active{left:0}

/* OVERLAY */
.overlay{
position:fixed;
inset:0;
background:rgba(0,0,0,.6);
display:none;
z-index:9;
}
.overlay.active{display:block}

/* ===== TÍTULO INSANO COM FOGO ===== */

.titulo-wrap{
position:relative;
display:inline-flex;
align-items:center;
justify-content:center;
padding:8px 18px;
filter:drop-shadow(0 0 10px rgba(255,120,0,.35)) drop-shadow(0 0 25px rgba(255,80,0,.25))
}

.titulo-wrap:before{
content:"";
position:absolute;
left:-5%;
right:-5%;
top:50%;
height:120%;
transform:translateY(-50%);
background:
radial-gradient(circle at 20% 50%,rgba(255,140,0,.22),transparent 22%),
radial-gradient(circle at 50% 40%,rgba(255,90,0,.18),transparent 30%),
radial-gradient(circle at 80% 50%,rgba(255,180,0,.18),transparent 22%);
filter:blur(18px);
z-index:0;
animation:auraFogo 2.4s ease-in-out infinite alternate
}

@keyframes auraFogo{
0%{transform:translateY(-50%) scale(1)}
100%{transform:translateY(-50%) scale(1.06)}
}

.glitch{
position:relative;
z-index:3;
display:inline-block;
font-size:34px;
font-weight:900;
letter-spacing:3px;
text-transform:uppercase;
color:#fff4db;
line-height:1;
margin:0;
text-shadow:
0 0 4px #fff3d6,
0 0 8px #ffcf66,
0 0 16px #ff8c00,
0 0 28px #ff5a00,
0 0 52px #ff2a00;
animation:fogoMain .12s infinite alternate,tremer .9s infinite steps(2,end)
}

.glitch:before,
.glitch:after{
content:attr(data-text);
position:absolute;
left:0;
top:0;
width:100%;
overflow:hidden;
pointer-events:none
}

.glitch:before{
color:rgba(255,60,0,.85);
z-index:-1;
transform:translate(-2px,-1px);
text-shadow:
0 0 8px #ff2a00,
0 0 18px #ff5a00,
0 0 30px #ff8c00;
animation:glitchLeft .18s infinite steps(2,end)
}

.glitch:after{
color:rgba(255,200,80,.9);
z-index:-1;
transform:translate(2px,1px);
text-shadow:
0 0 8px #ffae00,
0 0 18px #ff8c00,
0 0 34px #ff4500;
animation:glitchRight .14s infinite steps(2,end)
}

.fogo-topo{
position:absolute;
left:50%;
top:50%;
transform:translate(-50%,-58%);
width:115%;
height:95%;
pointer-events:none;
z-index:2;
filter:blur(1.2px) saturate(1.25)
}

.fogo-topo span{
position:absolute;
bottom:18%;
width:16%;
border-radius:50% 50% 45% 45%;
background:linear-gradient(to top,rgba(255,60,0,.96),rgba(255,140,0,.92),rgba(255,220,140,.28),transparent);
box-shadow:
0 0 14px rgba(255,100,0,.7),
0 0 28px rgba(255,140,0,.45);
transform-origin:center bottom;
animation:subirChama ease-in-out infinite alternate
}

.fogo-topo span:nth-child(1){left:2%;height:40px;animation-duration:1.0s}
.fogo-topo span:nth-child(2){left:12%;height:52px;animation-duration:.8s}
.fogo-topo span:nth-child(3){left:23%;height:42px;animation-duration:1.15s}
.fogo-topo span:nth-child(4){left:35%;height:62px;animation-duration:.95s}
.fogo-topo span:nth-child(5){left:48%;height:48px;animation-duration:1.1s}
.fogo-topo span:nth-child(6){left:59%;height:60px;animation-duration:.78s}
.fogo-topo span:nth-child(7){left:71%;height:44px;animation-duration:1.05s}
.fogo-topo span:nth-child(8){left:83%;height:54px;animation-duration:.9s}

@keyframes subirChama{
0%{
transform:translateY(0) scaleY(.9) scaleX(.95) rotate(-2deg);
opacity:.65
}
100%{
transform:translateY(-8px) scaleY(1.25) scaleX(1.08) rotate(2deg);
opacity:.98
}
}

.brasas-titulo{
position:absolute;
inset:-18px -24px -10px -24px;
pointer-events:none;
z-index:4
}

.brasas-titulo i{
position:absolute;
bottom:10px;
width:5px;
height:5px;
border-radius:50%;
background:#ffb347;
box-shadow:0 0 10px #ff8c00,0 0 20px rgba(255,90,0,.85);
animation:brasasTitulo linear infinite
}

.brasas-titulo i:nth-child(1){left:8%;animation-duration:1.8s;animation-delay:.1s}
.brasas-titulo i:nth-child(2){left:16%;animation-duration:2.2s;animation-delay:.4s}
.brasas-titulo i:nth-child(3){left:26%;animation-duration:1.7s;animation-delay:.2s}
.brasas-titulo i:nth-child(4){left:38%;animation-duration:2.4s;animation-delay:.7s}
.brasas-titulo i:nth-child(5){left:50%;animation-duration:1.9s;animation-delay:.3s}
.brasas-titulo i:nth-child(6){left:60%;animation-duration:2.5s;animation-delay:.5s}
.brasas-titulo i:nth-child(7){left:72%;animation-duration:1.6s;animation-delay:.1s}
.brasas-titulo i:nth-child(8){left:82%;animation-duration:2.2s;animation-delay:.6s}
.brasas-titulo i:nth-child(9){left:91%;animation-duration:1.75s;animation-delay:.2s}

@keyframes brasasTitulo{
0%{transform:translateY(0) translateX(0) scale(.7);opacity:0}
12%{opacity:1}
100%{transform:translateY(-38px) translateX(12px) scale(1.2);opacity:0}
}

.reflexo-fogo{
position:absolute;
left:8%;
right:8%;
bottom:-12px;
height:18px;
background:radial-gradient(ellipse at center,rgba(255,120,0,.42),rgba(255,80,0,.14),transparent 70%);
filter:blur(8px);
z-index:1;
animation:reflexoPulso 1.3s ease-in-out infinite alternate
}

@keyframes reflexoPulso{
0%{opacity:.5;transform:scaleX(.96)}
100%{opacity:.95;transform:scaleX(1.04)}
}

@keyframes fogoMain{
0%{
text-shadow:
0 0 4px #fff3d6,
0 0 8px #ffcf66,
0 0 16px #ff8c00,
0 0 28px #ff5a00,
0 0 52px #ff2a00;
filter:brightness(1)
}
100%{
text-shadow:
0 0 5px #fff7ea,
0 0 12px #ffd26c,
0 0 24px #ff9a1f,
0 0 40px #ff5a00,
0 0 70px #ff1e00;
filter:brightness(1.08)
}
}

@keyframes glitchLeft{
0%{transform:translate(-2px,0)}
25%{transform:translate(-4px,-1px)}
50%{transform:translate(-1px,1px)}
75%{transform:translate(-3px,0)}
100%{transform:translate(-2px,-1px)}
}

@keyframes glitchRight{
0%{transform:translate(2px,0)}
25%{transform:translate(5px,1px)}
50%{transform:translate(1px,-1px)}
75%{transform:translate(3px,0)}
100%{transform:translate(2px,1px)}
}

@keyframes tremer{
0%{transform:translate(0,0)}
25%{transform:translate(.6px,-.3px)}
50%{transform:translate(-.6px,.3px)}
75%{transform:translate(.4px,.2px)}
100%{transform:translate(0,0)}
}

/* CONTEÚDO */
.wrap{
max-width:620px;
margin:auto;
padding:20px;
position:relative;
z-index:3;
}

.card{
background:rgba(17,17,17,.9);
border:1px solid rgba(255,122,0,.35);
border-radius:12px;
padding:20px;
box-shadow:0 0 30px rgba(255,122,0,.08);
}

.info{
background:#1d0d00;
padding:12px;
border-radius:10px;
margin-bottom:14px;
border:1px solid rgba(255,122,0,.16);
line-height:1.7;
}

input,textarea,button{
width:100%;
padding:12px;
margin:7px 0;
border:none;
border-radius:8px;
box-sizing:border-box;
font-size:15px;
}

input,textarea{
background:#1a1a1a;
color:#fff;
border:1px solid rgba(255,122,0,.15);
outline:none;
}

input:focus,textarea:focus{
border-color:#ff7a00;
box-shadow:0 0 0 2px rgba(255,122,0,.12);
}

button{
background:linear-gradient(180deg,#ff8c00,#ff5e00);
color:#fff;
font-weight:bold;
cursor:pointer;
}

.vagas{
margin-top:14px;
background:#1d0d00;
border-radius:10px;
padding:12px;
border:1px solid rgba(255,122,0,.16);
}

.vagas b{font-size:28px}

footer{
padding:16px;
border-top:1px solid #ff7a00;
background:rgba(0,0,0,.4);
margin-top:16px;
position:relative;
z-index:3;
}

.erro-box{
margin-top:14px;
background:rgba(255,0,0,.08);
border:1px solid rgba(255,80,80,.35);
color:#ffd6d6;
border-radius:10px;
padding:12px;
display:none;
}

@media(max-width:700px){
header{height:82px}
.glitch{font-size:26px;letter-spacing:2px}
.fogo-topo{width:120%;height:88%}
}
</style>
</head>

<body>

<div class="embers">
<span style="left:10%;animation-duration:9s"></span>
<span style="left:30%;animation-duration:11s"></span>
<span style="left:55%;animation-duration:8s"></span>
<span style="left:75%;animation-duration:12s"></span>
<span style="left:90%;animation-duration:9s"></span>
</div>

<div class="overlay" id="overlay" onclick="fecharMenu()"></div>

<div class="sidebar" id="side">
<a href="index.html">INÍCIO</a>
<a href="ademar.html">ADM</a>
<a href="inscrição.html">INSCRIÇÃO</a>
</div>

<header>
<button class="menu-btn" onclick="m()" aria-label="Abrir menu">
<span></span>
<span></span>
</button>

<div class="titulo-wrap">

<div class="fogo-topo">
<span></span>
<span></span>
<span></span>
<span></span>
<span></span>
<span></span>
<span></span>
<span></span>
</div>

<h1 class="glitch" id="titulo" data-text="ZONA CASUAL">ZONA CASUAL</h1>

<div class="brasas-titulo">
<i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i>
</div>

<div class="reflexo-fogo"></div>

</div>
</header>

<div class="wrap">
<div class="card">

<div class="info" id="infoTxt">
<b>Somente o líder da equipe</b> deve fazer a inscrição.
</div>

<form id="f" action="https://formspree.io/f/myknkqyb" method="POST">
<input name="Equipe" placeholder="Nome da Equipe" required>
<input name="Lider" placeholder="Nome do Líder" required>
<input name="Whatsapp" placeholder="WhatsApp do Líder" required>
<input name="Jogador1" placeholder="Jogador 1" required>
<input name="Jogador2" placeholder="Jogador 2">
<input name="Jogador3" placeholder="Jogador 3">
<input name="Jogador4" placeholder="Jogador 4">
<textarea name="Observacoes" placeholder="Observações"></textarea>
<button id="enviar" type="submit">Enviar Inscrição</button>
</form>

<div class="vagas">
Vagas Disponíveis<br><br>
<b id="v">12</b> / <span id="totalTxt">12</span>
<div id="msg" style="display:none;color:#ff9b6b;margin-top:8px">Vagas esgotadas</div>
</div>

<div class="erro-box" id="erroBox"></div>

</div>
</div>

<footer>© 2026 Zona Casual</footer>

<script>
let T = 12;
let u = parseInt(localStorage.getItem("vagasUsadas") || "0", 10);

function m(){
  document.getElementById("side").classList.toggle("active");
  document.getElementById("overlay").classList.toggle("active");
}

function fecharMenu(){
  document.getElementById("side").classList.remove("active");
  document.getElementById("overlay").classList.remove("active");
}

function upd(){
  if(T < 1) T = 1;
  if(u < 0) u = 0;
  if(u > T) u = T;

  let r = T - u;
  if(r < 0) r = 0;

  document.getElementById("v").innerText = r;
  document.getElementById("totalTxt").innerText = T;

  if(r <= 0){
    document.getElementById("enviar").disabled = true;
    document.getElementById("enviar").style.opacity = ".6";
    document.getElementById("msg").style.display = "block";
  }else{
    document.getElementById("enviar").disabled = false;
    document.getElementById("enviar").style.opacity = "1";
    document.getElementById("msg").style.display = "none";
  }
}

function mostrarErro(msg){
  const box = document.getElementById("erroBox");
  box.style.display = "block";
  box.textContent = msg;
}

async function carregarDados(){
  try{
    const res = await fetch("dados.json?nocache=" + Date.now());
    if(!res.ok) throw new Error("Não foi possível carregar dados.json");
    const dados = await res.json();

    const titulo = dados.titulo || "ZONA CASUAL";
    const tituloEl = document.getElementById("titulo");
    tituloEl.textContent = titulo;
    tituloEl.setAttribute("data-text", titulo);

    document.title = "Inscrição - " + titulo;

    if(dados.infoInscricao){
      document.getElementById("infoTxt").innerHTML = dados.infoInscricao;
    }

    if(dados.formAction){
      document.getElementById("f").action = dados.formAction;
    }

    if(dados.totalTimes){
      T = parseInt(dados.totalTimes,10);
    }else{
      T = 12;
    }

    upd();
  }catch(e){
    console.error(e);
    T = 12;
    upd();
    mostrarErro("Erro ao carregar dados.json. A página usou valores padrão.");
  }
}

document.getElementById("f").addEventListener("submit", function(e){
  if(u >= T){
    e.preventDefault();
    upd();
    return;
  }

  u++;
  localStorage.setItem("vagasUsadas", u);
});

window.addEventListener("DOMContentLoaded", carregarDados);
</script>

</body>
</html>
