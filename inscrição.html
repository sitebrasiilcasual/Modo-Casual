<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Inscrição - Zona Casual</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}

body{
font-family:Arial;
background:#000;
color:#fff;
text-align:center;
padding:20px
}

.container{
max-width:700px;
margin:auto
}

.card{
background:#111;
border:1px solid rgba(255,140,0,.3);
border-radius:14px;
padding:20px;
margin-bottom:18px
}

h1{
color:#ff8c00;
margin-bottom:14px
}

.info{
margin-bottom:14px;
color:#ddd
}

/* BARRA */

.progress-box{
margin:16px 0
}

.progress-bar{
width:100%;
height:18px;
background:#222;
border-radius:20px;
overflow:hidden
}

.progress{
height:100%;
background:linear-gradient(90deg,#ff8c00,#ffb347);
width:0%;
transition:.3s
}

.vagas{
margin-top:8px;
font-size:20px;
font-weight:bold
}

form{
display:grid;
gap:10px
}

input{
padding:12px;
border-radius:8px;
border:none;
background:#1a1a1a;
color:#fff
}

button{
padding:14px;
background:#ff8c00;
border:none;
border-radius:10px;
font-weight:bold;
cursor:pointer
}

button:disabled{
opacity:.5
}

.msg{
margin-top:10px
}

</style>
</head>

<body>

<div class="container">

<div class="card">

<h1>Inscrição</h1>

<p class="info">
Preencha os dados do seu time | Se o modo for trio ou duo 
  ponha um . na vaga extra.
</p>

<div class="progress-box">

<div class="progress-bar">
<div class="progress" id="bar"></div>
</div>

<div class="vagas" id="vagas">0 / 0</div>

</div>

<form id="form">

<input id="time" placeholder="Nome do Clã" required>

<input id="whatsapp" placeholder="Whatsapp do Líder" required>

<input id="integrante1" placeholder="Integrante 1" required>

<input id="integrante2" placeholder="Integrante 2" required>

<input id="integrante3" placeholder="Integrante 3" required>

<input id="integrante4" placeholder="Integrante 4" required>

<button id="btn">
Enviar inscrição
</button>

</form>

<div class="msg" id="msg"></div>

</div>

</div>

<script>

const API="https://script.google.com/macros/s/AKfycbxukc8jJvSKJR8JMlL9ebwh0mR0JSkBh9xYvGvdJJHN1j-Wv0tL5Of2-O1p7tWpcwu4FQ/exec"

async function carregar(){

const r=await fetch(API)
const j=await r.json()

const total=j.vagas_total
const rest=j.vagas_restantes

document.getElementById("vagas").innerText=rest+" / "+total

const porcent=( (total-rest)/total )*100

document.getElementById("bar").style.width=porcent+"%"

if(rest<=0){
document.getElementById("btn").disabled=true
}

}

document.getElementById("form").addEventListener("submit",async e=>{

e.preventDefault()

const d=new URLSearchParams()

d.append("time",time.value)
d.append("whatsapp",whatsapp.value)
d.append("integrante1",integrante1.value)
d.append("integrante2",integrante2.value)
d.append("integrante3",integrante3.value)
d.append("integrante4",integrante4.value)

await fetch(API,{
method:"POST",
body:d
})

form.reset()

carregar()

})

carregar()

setInterval(carregar,4000)

</script>

</body>
</html>
