<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Zona Casual</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{overflow-x:hidden}
body{
font-family:Arial,sans-serif;
background:#000;
color:#fff;
text-align:center;
position:relative;
min-height:100vh;
}
body:before{
content:"";
position:fixed;
inset:0;
z-index:-3;
background:
radial-gradient(circle at 20% 20%,rgba(255,140,0,.16),transparent 35%),
radial-gradient(circle at 80% 30%,rgba(255,180,0,.10),transparent 30%),
linear-gradient(to bottom,rgba(25,12,0,.82),rgba(0,0,0,.96));
}
.embers{
position:fixed;
inset:0;
pointer-events:none;
overflow:hidden;
z-index:-2;
}
.embers span{
position:absolute;
bottom:-30px;
width:6px;
height:6px;
border-radius:50%;
background:#ff9a1f;
box-shadow:0 0 12px #ff8c00,0 0 24px rgba(255,140,0,.85);
animation:subir linear infinite;
opacity:0;
}
@keyframes subir{
0%{transform:translateY(0) translateX(0) scale(.7);opacity:0}
10%{opacity:.95}
100%{transform:translateY(-120vh) translateX(40px) scale(1.2);opacity:0}
}
header{
background:rgba(17,17,17,.92);
border-bottom:2px solid #ff8c00;
padding:24px 14px 20px;
position:relative;
overflow:hidden;
}
.glitch{
font-size:40px;
font-weight:900;
letter-spacing:4px;
text-transform:uppercase;
position:relative;
display:inline-block;
color:#fff7eb;
transform:perspective(600px) rotateX(10deg);
text-shadow:
0 2px 0 #ffb347,
0 4px 0 #ff8c00,
0 6px 0 #ff6a00,
0 8px 18px rgba(255,69,0,.9),
0 0 35px rgba(255,90,0,.95);
animation:falha 2.2s infinite;
}
.glitch:before,.glitch:after{
content:attr(data-text);
position:absolute;
left:0;top:0;
width:100%;
pointer-events:none;
}
.glitch:before{
color:#ff4500;
transform:translate(-3px,-2px);
opacity:.8;
mix-blend-mode:screen;
animation:gl1 .18s infinite;
}
.glitch:after{
color:#ffcf66;
transform:translate(3px,2px);
opacity:.8;
mix-blend-mode:screen;
animation:gl2 .18s infinite;
}
@keyframes falha{
0%,100%{transform:perspective(600px) rotateX(10deg) skewX(0)}
15%{transform:perspective(600px) rotateX(10deg) skewX(2deg)}
16%{transform:perspective(600px) rotateX(10deg) skewX(-2deg)}
17%{transform:perspective(600px) rotateX(10deg) skewX(0)}
52%{transform:perspective(600px) rotateX(10deg) skewX(-3deg)}
53%{transform:perspective(600px) rotateX(10deg) skewX(2deg)}
54%{transform:perspective(600px) rotateX(10deg) skewX(0)}
}
@keyframes gl1{
0%{transform:translate(-3px,-2px)}
25%{transform:translate(-6px,-1px)}
50%{transform:translate(-2px,1px)}
75%{transform:translate(-5px,-2px)}
100%{transform:translate(-3px,-2px)}
}
@keyframes gl2{
0%{transform:translate(3px,2px)}
25%{transform:translate(6px,1px)}
50%{transform:translate(2px,-1px)}
75%{transform:translate(5px,2px)}
100%{transform:translate(3px,2px)}
}
.linha-energia{
height:3px;
width:100%;
background:linear-gradient(90deg,transparent,#ff6a00,#ff8c00,#ff4500,transparent);
background-size:300% 100%;
animation:energia 3s linear infinite;
box-shadow:0 0 10px #ff6a00,0 0 24px rgba(255,140,0,.7);
}
@keyframes energia{
0%{background-position:-300% 0}
100%{background-position:300% 0}
}
.container{
max-width:900px;
margin:auto;
padding:20px 14px 30px;
}
.card{
background:rgba(17,17,17,.92);
border:1px solid rgba(255,140,0,.35);
border-radius:14px;
padding:20px;
margin-bottom:18px;
box-shadow:0 0 0 1px rgba(255,140,0,.08),0 10px 25px rgba(0,0,0,.35);
}
.card h2{
margin-bottom:14px;
color:#fff3d6;
text-shadow:0 0 10px rgba(255,140,0,.25);
}
.btn{
display:inline-block;
padding:12px 20px;
border-radius:999px;
background:#ff8c00;
color:#000;
text-decoration:none;
font-weight:700;
margin-top:14px;
box-shadow:0 0 18px rgba(255,140,0,.3);
}
.config-btn{
position:fixed;
left:12px;
bottom:12px;
width:38px;
height:38px;
display:flex;
align-items:center;
justify-content:center;
font-size:16px;
text-decoration:none;
color:#fff;
background:rgba(255,140,0,.18);
border:1px solid rgba(255,140,0,.4);
border-radius:50%;
transition:.2s;
z-index:20;
}
.config-btn:hover{
transform:scale(1.08);
background:#ff8c00;
color:#000;
}
.vaga-wrap{
display:flex;
justify-content:center;
align-items:center;
margin:12px 0 8px;
}
.vaga-circle{
position:relative;
width:210px;
height:210px;
border-radius:50%;
display:flex;
align-items:center;
justify-content:center;
background:linear-gradient(145deg,#0d0d0d,#161616 55%,#0a0a0a);
border:3px solid #ff8c00;
box-shadow:0 0 12px rgba(255,140,0,.45),0 0 28px rgba(255,140,0,.28),inset 0 0 20px rgba(255,140,0,.08);
overflow:hidden;
}
.vaga-circle:before{
content:"";
position:absolute;
inset:10px;
border-radius:50%;
border:2px solid rgba(255,140,0,.28);
animation:giro 10s linear infinite;
}
.vaga-circle:after{
content:"";
position:absolute;
width:75%;
height:75%;
border-radius:50%;
border:1px dashed rgba(255,180,100,.35);
animation:giro2 14s linear infinite reverse;
}
.vaga-scan{
position:absolute;
width:100%;
height:100%;
border-radius:50%;
background:conic-gradient(from 0deg,transparent 0deg,transparent 260deg,rgba(255,140,0,.3) 320deg,transparent 360deg);
animation:scan 3s linear infinite;
}
.vaga-content{
position:relative;
z-index:5;
text-align:center;
}
.vaga-top{
font-size:50px;
font-weight:900;
color:#fff7eb;
text-shadow:0 0 10px #ff8c00;
min-width:120px;
}
@keyframes giro{from{transform:rotate(0)}to{transform:rotate(360deg)}}
@keyframes giro2{from{transform:rotate(0)}to{transform:rotate(360deg)}}
@keyframes scan{from{transform:rotate(0)}to{transform:rotate(360deg)}}
.logo-grid{
display:flex;
justify-content:center;
gap:18px;
flex-wrap:wrap;
}
.logo-box{
width:120px;
background:rgba(255,140,0,.05);
border:1px solid rgba(255,140,0,.18);
border-radius:12px;
padding:12px;
}
.logo-box img{
width:76px;
height:76px;
object-fit:cover;
border-radius:12px;
background:#111;
border:2px solid rgba(255,140,0,.25);
}
.logo-box p{
margin-top:8px;
font-size:13px;
font-weight:700;
}
.slide-wrap{
overflow:hidden;
width:100%;
}
.slide-track{
display:flex;
gap:22px;
align-items:stretch;
width:max-content;
}
.team{
min-width:130px;
background:rgba(255,140,0,.05);
border:1px solid rgba(255,140,0,.18);
border-radius:12px;
padding:14px 10px;
}
.team img{
width:84px;
height:84px;
object-fit:cover;
border-radius:12px;
border:2px solid rgba(255,140,0,.35);
background:#111;
}
.team p{
margin-top:10px;
font-weight:700;
font-size:14px;
}
.streamer img{
width:120px;
height:120px;
border-radius:50%;
border:3px solid #ff8c00;
object-fit:cover;
background:#111;
}
#streamerNome{margin-top:10px}
.sobre-img{
width:220px;
height:220px;
border-radius:50%;
border:3px solid #ff8c00;
object-fit:cover;
display:block;
margin:0 auto 14px;
background:#111;
box-shadow:0 0 18px rgba(255,140,0,.35);
}
#sobre{line-height:1.7;color:#ddd}
footer{
padding:18px;
border-top:1px solid #ff8c00;
margin-top:10px;
}
@media(max-width:600px){
.glitch{font-size:28px;letter-spacing:2px}
.vaga-circle{width:180px;height:180px}
.vaga-top{font-size:40px;min-width:100px}
.team{min-width:118px}
.sobre-img{width:180px;height:180px}
}
</style>
</head>
<body>

<div class="embers">
<span style="left:4%;animation-duration:9s"></span>
<span style="left:11%;animation-duration:11s"></span>
<span style="left:18%;animation-duration:8s"></span>
<span style="left:26%;animation-duration:12s"></span>
<span style="left:34%;animation-duration:9.5s"></span>
<span style="left:42%;animation-duration:10.5s"></span>
<span style="left:50%;animation-duration:8.8s"></span>
<span style="left:58%;animation-duration:11.8s"></span>
<span style="left:66%;animation-duration:9.2s"></span>
<span style="left:74%;animation-duration:10.8s"></span>
<span style="left:82%;animation-duration:12.4s"></span>
<span style="left:90%;animation-duration:9.7s"></span>
<span style="left:96%;animation-duration:11.2s"></span>
</div>

<header>
<h1 id="titulo" class="glitch" data-text="ZONA CASUAL">ZONA CASUAL</h1>
</header>

<a href="ademar.html" class="config-btn">⚙</a>

<div class="linha-energia"></div>

<div class="container">

<div class="card" id="patroCard" style="display:none">
<h2>PATROCINADORES</h2>
<div class="logo-grid" id="patroGrid"></div>
</div>

<div class="card" id="timesCard" style="display:none">
<h2>TIMES ENVOLVIDOS</h2>
<div class="slide-wrap">
<div class="slide-track" id="timesSlide"></div>
</div>
</div>

<div class="card">
<h2>Próxima Personalizada</h2>
<p><b>Data:</b> <span id="dataTxt">-</span></p>
<p><b>Horário:</b> <span id="horaTxt">-</span></p>
</div>

<div class="card">
<h2>Vagas</h2>
<div class="vaga-wrap">
<div class="vaga-circle">
<div class="vaga-scan"></div>
<div class="vaga-content">
<div class="vaga-top" id="vagaNumero">0/0</div>
</div>
</div>
</div>
<a class="btn" href="inscrição.html">INSCRIÇÃO P/ PERSONALIZADA</a>
</div>

<div class="card streamer">
<h2>Streamer</h2>
<img id="streamerImg" src="" alt="">
<p id="streamerNome">@streamer</p>
</div>

<div class="card">
<h2>Sobre o Projeto</h2>
<img id="sobreImg" class="sobre-img" src="" alt="">
<p id="sobre"></p>
</div>

</div>

<footer>© 2026 Zona Casual</footer>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbxDpXJcIFKBOZVnHmIeQHSmoWM5k7MJjk5_o1u6krutoygcZsvq1SaQKw8QZlrZu-Zi0A/exec";

let slideInterval = null;
const slide = document.getElementById("timesSlide");

function iniciarSlide(){
if(slideInterval) clearInterval(slideInterval);
slide.style.transform = "translateX(0)";
if(slide.children.length <= 1) return;

slideInterval = setInterval(()=>{
const primeiro = slide.children[0];
if(!primeiro) return;
const largura = primeiro.offsetWidth + 22;
slide.style.transition = "transform .6s ease";
slide.style.transform = `translateX(-${largura}px)`;
setTimeout(()=>{
slide.appendChild(primeiro);
slide.style.transition = "none";
slide.style.transform = "translateX(0)";
},600);
},2600);
}

function aplicarDadosSite(dadosSite){
const titulo = dadosSite.titulo || "ZONA CASUAL";
const tituloEl = document.getElementById("titulo");
tituloEl.textContent = titulo;
tituloEl.setAttribute("data-text", titulo);
document.title = titulo;

document.getElementById("dataTxt").textContent = dadosSite.data || "-";
document.getElementById("horaTxt").textContent = dadosSite.horario || "-";

document.getElementById("sobre").textContent = dadosSite.sobre?.texto || "";
document.getElementById("sobreImg").src = dadosSite.sobre?.imagem || "";

document.getElementById("streamerNome").textContent = dadosSite.streamers?.[0]?.nome || "@streamer";
document.getElementById("streamerImg").src = dadosSite.streamers?.[0]?.foto || "";

const patroCard = document.getElementById("patroCard");
const patroGrid = document.getElementById("patroGrid");
patroGrid.innerHTML = "";
if(Array.isArray(dadosSite.patrocinadores) && dadosSite.patrocinadores.length){
patroCard.style.display = "block";
dadosSite.patrocinadores.forEach(p=>{
patroGrid.insertAdjacentHTML("beforeend", `
<div class="logo-box">
<img src="${p.foto || p.img || p.logo || ""}" alt="">
<p>${p.nome || ""}</p>
</div>
`);
});
}else{
patroCard.style.display = "none";
}

const timesCard = document.getElementById("timesCard");
slide.innerHTML = "";
if(Array.isArray(dadosSite.times) && dadosSite.times.length){
timesCard.style.display = "block";
dadosSite.times.forEach(t=>{
slide.insertAdjacentHTML("beforeend", `
<div class="team">
<img src="${t.foto || t.img || t.logo || ""}" alt="">
<p>${t.nome || ""}</p>
</div>
`);
});
iniciarSlide();
}else{
timesCard.style.display = "none";
if(slideInterval) clearInterval(slideInterval);
}
}

function aplicarVagas(dadosSite, dadosVagas){
const total = Number(dadosVagas?.vagas_total) || Number(dadosSite.vagas_total) || 0;
const restantes = Math.max(0, Number(dadosVagas?.vagas_restantes) || Number(dadosSite.vagas_total) || 0);
document.getElementById("vagaNumero").textContent = total + "/" + restantes;
}

async function carregarTudo(){
let dadosSite = null;

try{
const resSite = await fetch("dados.json?t=" + Date.now(), {cache:"no-store"});
dadosSite = await resSite.json();
aplicarDadosSite(dadosSite);
}catch(e){
console.error("Erro no dados.json", e);
return;
}

try{
const resVagas = await fetch(API_URL + "?t=" + Date.now(), {cache:"no-store"});
const dadosVagas = await resVagas.json();
if(dadosVagas.ok){
aplicarVagas(dadosSite, dadosVagas);
}else{
const total = Number(dadosSite.vagas_total) || 0;
document.getElementById("vagaNumero").textContent = total + "/" + total;
}
}catch(e){
console.error("Erro na API de vagas", e);
const total = Number(dadosSite.vagas_total) || 0;
document.getElementById("vagaNumero").textContent = total + "/" + total;
}
}

window.addEventListener("DOMContentLoaded", ()=>{
carregarTudo();
setInterval(carregarTudo, 4000);
});
</script>

</body>
</html>
