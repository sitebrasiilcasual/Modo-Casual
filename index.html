<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Zona Casual</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{overflow-x:hidden}

body{
font-family:Arial;
background:#000;
color:#fff;
text-align:center;
position:relative
}

body:before{
content:"";
position:fixed;
inset:0;
z-index:-3;
background:
radial-gradient(circle at 20% 20%,rgba(255,140,0,.16),transparent 35%),
radial-gradient(circle at 80% 30%,rgba(255,180,0,.10),transparent 30%),
linear-gradient(to bottom,rgba(25,12,0,.82),rgba(0,0,0,.96))
}

/* brasas */

.embers{
position:fixed;
inset:0;
pointer-events:none;
overflow:hidden;
z-index:-2
}

.embers span{
position:absolute;
bottom:-20px;
width:5px;
height:5px;
border-radius:50%;
background:#ff9a1f;
box-shadow:0 0 12px #ff8c00;
animation:e linear infinite
}

@keyframes e{
0%{transform:translateY(0);opacity:0}
10%{opacity:.9}
100%{transform:translateY(-120vh) translateX(35px);opacity:0}
}

/* header */

header{
background:rgba(20,10,0,.9);
border-bottom:2px solid #ff8c00;
height:64px;
display:flex;
align-items:center;
justify-content:center
}

/* glitch fogo */

.glitch{
position:relative;
display:inline-block;
font-size:28px;
font-weight:900;
letter-spacing:2px;
text-transform:uppercase;
color:#fff;

text-shadow:
0 0 5px #ff6a00,
0 0 10px #ff8c00,
0 0 20px #ff8c00,
0 0 40px #ff4500,
0 0 70px rgba(255,120,0,.6);

animation:
fireGlow 1.6s infinite alternate,
fireFlicker .25s infinite;
}

.glitch:before,
.glitch:after{
content:attr(data-text);
position:absolute;
left:0;
top:0;
width:100%;
overflow:hidden;
pointer-events:none;
}

/* camada superior */

.glitch:before{
color:#ff8c00;
transform:translate(-2px,0);
text-shadow:-2px 0 #ff4500;
animation:
glitchTop 2s infinite linear alternate-reverse,
fireShift 3s infinite;
}

/* camada inferior */

.glitch:after{
color:#ff4500;
transform:translate(2px,0);
text-shadow:2px 0 #ff8c00;
animation:
glitchBottom 1.8s infinite linear alternate-reverse,
fireShift 2.5s infinite;
}

/* brilho do fogo */

@keyframes fireGlow{
0%{
text-shadow:
0 0 5px #ff6a00,
0 0 10px #ff8c00,
0 0 20px #ff8c00,
0 0 40px #ff4500;
}

100%{
text-shadow:
0 0 10px #ff6a00,
0 0 25px #ff8c00,
0 0 45px #ff4500,
0 0 80px rgba(255,120,0,.6);
}
}

/* tremida do fogo */

@keyframes fireFlicker{
0%{transform:translate(0,0)}
25%{transform:translate(.4px,-.3px)}
50%{transform:translate(-.3px,.2px)}
75%{transform:translate(.3px,.4px)}
100%{transform:translate(0,0)}
}

/* mudança de cor */

@keyframes fireShift{
0%{filter:hue-rotate(0deg)}
50%{filter:hue-rotate(10deg)}
100%{filter:hue-rotate(0deg)}
}

/* glitch topo */

@keyframes glitchTop{
0%{clip-path:inset(0 0 80% 0)}
25%{clip-path:inset(20% 0 50% 0)}
50%{clip-path:inset(40% 0 30% 0)}
75%{clip-path:inset(10% 0 70% 0)}
100%{clip-path:inset(0 0 80% 0)}
}

/* glitch baixo */

@keyframes glitchBottom{
0%{clip-path:inset(80% 0 0 0)}
25%{clip-path:inset(60% 0 20% 0)}
50%{clip-path:inset(70% 0 10% 0)}
75%{clip-path:inset(85% 0 0 0)}
100%{clip-path:inset(80% 0 0 0)}
}

/* container */

.container{
max-width:860px;
margin:auto;
padding:20px
}

.card{
background:rgba(17,17,17,.9);
border:1px solid rgba(255,140,0,.35);
border-radius:12px;
padding:20px;
margin-bottom:18px
}

.card h2{margin-bottom:14px}

/* botão */

.btn{
display:inline-block;
padding:12px 20px;
border-radius:999px;
background:#ff8c00;
color:#000;
text-decoration:none;
font-weight:bold;
margin-top:14px
}

/* barra vagas */

.vaga-barra{
width:100%;
height:16px;
background:#2a2a2a;
border-radius:999px;
overflow:hidden
}

.vaga-preenchida{
height:100%;
width:0%;
background:linear-gradient(90deg,#ff8c00,#ffb347);
transition:.8s
}

#vagaTexto{margin-top:6px;color:#ccc}

/* slide times */

.slide-wrap{overflow:hidden}
.slide-track{display:flex;gap:25px}

.team{min-width:120px}

.team img{
width:80px;
height:80px;
object-fit:contain
}

/* patrocinadores */

.logo-grid{
display:flex;
justify-content:center;
gap:25px;
flex-wrap:wrap
}

.logo-box img{
width:80px;
height:80px
}

/* streamer */

.streamer img{
width:110px;
height:110px;
border-radius:50%;
border:2px solid rgba(255,140,0,.4)
}

/* sobre */

.sobre-img{
width:220px;
height:220px;
border-radius:50%;
border:3px solid #ff8c00
}

footer{
padding:16px;
border-top:1px solid #ff8c00
}
</style>
</head>

<body>

<div class="embers">
<span style="left:10%;animation-duration:9s"></span>
<span style="left:30%;animation-duration:11s"></span>
<span style="left:60%;animation-duration:8s"></span>
</div>

<header>
<h1 id="titulo" class="glitch" data-text="ZONA CASUAL">ZONA CASUAL</h1>
</header>

<div class="container">

<div class="card" id="patroCard" style="display:none">
<h2 id="patroTitulo">Patrocinadores</h2>
<div class="logo-grid" id="patroGrid"></div>
</div>

<div class="card">
<h2>Times Envolvidos</h2>
<div class="slide-wrap">
<div class="slide-track" id="timesSlide"></div>
</div>
</div>

<div class="card">
<h2>Próxima Personalizada</h2>
<p><b>Data:</b> <span id="dataTxt">-</span></p>
<p><b>Horário:</b> <span id="horaTxt">-</span></p>
</div>

<div class="card">
<h2>Vagas Preenchidas</h2>
<div class="vaga-barra">
<div class="vaga-preenchida" id="vagaBarra"></div>
</div>
<p id="vagaTexto">0 / 0 vagas</p>
<a class="btn" href="inscrição.html">INSCRIÇÃO PERSONALIZADA</a>
</div>

<div class="card streamer">
<h2>Streamer</h2>
<img id="streamerImg" src="streamer.jpg">
<p id="streamerNome">@streamer</p>
<a id="streamerLink" class="btn">Assistir Stream</a>
</div>

<div class="card">
<h2>Sobre o Projeto</h2>
<img id="sobreImg" class="sobre-img" src="zona.png">
<p id="sobre"></p>
</div>

</div>

<footer>© 2026 Zona Casual</footer>

<script>

let slideInterval=null

const slide=document.getElementById("timesSlide")

function iniciarSlide(){

if(slideInterval) clearInterval(slideInterval)

slideInterval=setInterval(()=>{

const primeiro=slide.children[0]

if(!primeiro || slide.children.length<=1) return

const largura=primeiro.offsetWidth+25

slide.style.transition="transform .6s ease"
slide.style.transform=`translateX(-${largura}px)`

setTimeout(()=>{

slide.appendChild(primeiro)

slide.style.transition="none"
slide.style.transform="translateX(0)"

},600)

},2600)

}

function aplicarDados(d){

document.getElementById("dataTxt").textContent=d.dataEvento||"-"
document.getElementById("horaTxt").textContent=d.horaEvento||"-"

document.getElementById("sobre").innerHTML=d.sobre||""

document.getElementById("streamerNome").textContent=d.streamerPrincipal?.nome||"@streamer"
document.getElementById("streamerImg").src=d.streamerPrincipal?.img||"streamer.jpg"
document.getElementById("streamerLink").href=d.streamerPrincipal?.link||"#"

/* times */

slide.innerHTML=""

;(d.times||[]).forEach(t=>{
slide.insertAdjacentHTML("beforeend",
`<div class="team">
<img src="${t.img}">
<p>${t.nome}</p>
</div>`
)
})

iniciarSlide()

/* patrocinadores */

const patroGrid=document.getElementById("patroGrid")
const patroCard=document.getElementById("patroCard")

patroGrid.innerHTML=""

if(d.patrocinadores?.length){

patroCard.style.display="block"

d.patrocinadores.forEach(p=>{
patroGrid.insertAdjacentHTML("beforeend",
`<div class="logo-box">
<img src="${p.img}">
<p>${p.nome}</p>
</div>`
)
})

}

/* vagas */

const total=d.vagasTotal||0
const ocupadas=d.vagasOcupadas||0

let porcentagem=0

if(total>0)porcentagem=Math.round((ocupadas/total)*100)

document.getElementById("vagaBarra").style.width=porcentagem+"%"

document.getElementById("vagaTexto").textContent=ocupadas+" / "+total+" vagas"

}

async function carregarDados(){

const res=await fetch("dados.json?"+Date.now())

const dados=await res.json()

aplicarDados(dados)

}

window.addEventListener("DOMContentLoaded",carregarDados)

</script>

</body>
</html>
