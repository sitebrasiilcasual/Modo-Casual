<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Painel Zona Casual</title>

<style>

*{box-sizing:border-box}

body{
background:#000;
color:#fff;
font-family:Arial;
margin:0;
}

.wrap{
max-width:900px;
margin:auto;
padding:16px;
}

.card{
background:#111;
border:1px solid rgba(255,140,0,.25);
border-radius:16px;
padding:18px;
margin-bottom:16px;
}

h1,h2{
text-align:center;
color:#ff8c00;
margin-bottom:14px;
}

label{
display:block;
margin-top:10px;
margin-bottom:4px;
font-weight:bold;
}

input,textarea{
width:100%;
padding:12px;
border:none;
border-radius:10px;
background:#1c1c1c;
color:#fff;
font-size:15px;
}

textarea{
min-height:90px;
}

button{
width:100%;
padding:12px;
border:none;
border-radius:10px;
background:#ff8c00;
color:#000;
font-weight:bold;
font-size:15px;
cursor:pointer;
margin-top:10px;
}

button.sec{
background:#222;
color:#fff;
}

button.small{
width:auto;
padding:8px 12px;
font-size:13px;
}

.grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:10px;
}

.preview{
width:100px;
height:100px;
border-radius:12px;
object-fit:cover;
border:2px solid #ff8c00;
margin-top:8px;
display:block;
}

.item{
background:#181818;
padding:12px;
border-radius:12px;
margin-bottom:10px;
border:1px solid rgba(255,140,0,.15);
}

.item-title{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:6px;
}

.hidden{display:none}

.login{
max-width:360px;
margin:120px auto;
}

</style>
</head>
<body>

<div id="loginBox" class="login card">

<h1>Painel</h1>

<label>Senha</label>
<input id="senha" type="password">

<button onclick="login()">ENTRAR</button>

</div>

<div id="painel" class="wrap hidden">

<div class="card">

<h1>ZONA CASUAL</h1>

<label>Token GitHub</label>
<input id="token" placeholder="Cole seu token aqui">

<button onclick="salvarToken()">Salvar Token</button>

</div>


<div class="card">

<h2>Dados do Evento</h2>

<div class="grid">

<div>
<label>Data</label>
<input id="data">
</div>

<div>
<label>Horário</label>
<input id="horario">
</div>

</div>

<label>Total de vagas</label>
<input id="vagas" type="number">

</div>


<div class="card">

<h2>Sobre</h2>

<label>Texto</label>
<textarea id="sobreTexto"></textarea>

<label>Imagem</label>
<input type="file" id="sobreUpload">

<img id="previewSobre" class="preview">

</div>


<div class="card">

<h2>Streamer</h2>

<label>Nome</label>
<input id="streamerNome">

<label>Foto</label>
<input type="file" id="streamerUpload">

<img id="previewStreamer" class="preview">

</div>


<div class="card">

<h2>Patrocinadores</h2>

<div id="patros"></div>

<button onclick="addPatro()">Adicionar patrocinador</button>

</div>


<div class="card">

<h2>Times</h2>

<div id="times"></div>

<button onclick="addTime()">Adicionar time</button>

</div>


<div class="card">

<button onclick="removerFotos()">Remover todas as fotos</button>

<button onclick="salvar()">Salvar no GitHub</button>

</div>

</div>


<script>

const SENHA="1326"
const repo="sitebrasiilcasual/Modo-Casual"
const file="dados.json"

let patros=[]
let times=[]
let sha=""
let sobreBase64=""
let streamerBase64=""

function login(){

if(document.getElementById("senha").value!==SENHA){

alert("senha errada")
return

}

document.getElementById("loginBox").classList.add("hidden")
document.getElementById("painel").classList.remove("hidden")

document.getElementById("token").value=localStorage.getItem("github_token")||""

carregar()

}

function salvarToken(){

const token=document.getElementById("token").value.trim()

if(!token){
alert("Cole o token primeiro")
return
}

localStorage.setItem("github_token",token)
alert("Token salvo no navegador")

}

function preview(input,img){

const f=input.files[0]

if(!f)return

const r=new FileReader()

r.onload=e=>{
img.src=e.target.result

if(img.id==="previewSobre"){
sobreBase64=e.target.result
}

if(img.id==="previewStreamer"){
streamerBase64=e.target.result
}
}

r.readAsDataURL(f)

}

sobreUpload.onchange=()=>preview(sobreUpload,previewSobre)
streamerUpload.onchange=()=>preview(streamerUpload,previewStreamer)


function addPatro(nome="",foto=""){

patros.push({nome,foto})

renderPatros()

}

function renderPatros(){

const div=document.getElementById("patros")

div.innerHTML=""

patros.forEach((p,i)=>{

div.innerHTML+=`

<div class="item">

<div class="item-title">

<strong>Patrocinador ${i+1}</strong>

<button class="small sec" onclick="remPatro(${i})">Remover</button>

</div>

<input placeholder="Nome" value="${(p.nome||"").replace(/"/g,'&quot;')}" onchange="patros[${i}].nome=this.value">

<input type="file" onchange="patroUpload(${i},this)">

<img class="preview" src="${p.foto||""}">

</div>

`

})

}

function patroUpload(i,input){

const arquivo=input.files[0]
if(!arquivo)return

const r=new FileReader()

r.onload=e=>{

patros[i].foto=e.target.result

renderPatros()

}

r.readAsDataURL(arquivo)

}

function remPatro(i){

patros.splice(i,1)

renderPatros()

}



function addTime(nome="",foto=""){

times.push({nome,foto})

renderTimes()

}

function renderTimes(){

const div=document.getElementById("times")

div.innerHTML=""

times.forEach((t,i)=>{

div.innerHTML+=`

<div class="item">

<div class="item-title">

<strong>Time ${i+1}</strong>

<button class="small sec" onclick="remTime(${i})">Remover</button>

</div>

<input placeholder="Nome" value="${(t.nome||"").replace(/"/g,'&quot;')}" onchange="times[${i}].nome=this.value">

<input type="file" onchange="timeUpload(${i},this)">

<img class="preview" src="${t.foto||""}">

</div>

`

})

}

function timeUpload(i,input){

const arquivo=input.files[0]
if(!arquivo)return

const r=new FileReader()

r.onload=e=>{

times[i].foto=e.target.result

renderTimes()

}

r.readAsDataURL(arquivo)

}

function remTime(i){

times.splice(i,1)

renderTimes()

}



function removerFotos(){

previewSobre.src=""
previewStreamer.src=""

sobreBase64=""
streamerBase64=""

patros.forEach(p=>p.foto="")
times.forEach(t=>t.foto="")

renderPatros()
renderTimes()

alert("Fotos removidas. Agora clique em Salvar no GitHub.")

}



async function carregar(){

const res=await fetch("dados.json?t="+Date.now(),{cache:"no-store"})
const dados=await res.json()

data.value=dados.data||""
horario.value=dados.horario||""
vagas.value=dados.vagas_total||""

sobreTexto.value=dados.sobre?.texto||""
previewSobre.src=dados.sobre?.imagem||""
sobreBase64=dados.sobre?.imagem||""

streamerNome.value=dados.streamers?.[0]?.nome||""
previewStreamer.src=dados.streamers?.[0]?.foto||""
streamerBase64=dados.streamers?.[0]?.foto||""

patros=dados.patrocinadores||[]
times=dados.times||[]

renderPatros()
renderTimes()

}

async function pegarSHA(token){

const res=await fetch(`https://api.github.com/repos/${repo}/contents/${file}`,{
headers:{
Authorization:"token "+token,
Accept:"application/vnd.github+json"
}
})

const json=await res.json()

if(!res.ok){
console.error(json)
throw new Error(json.message||"Erro ao buscar SHA")
}

sha=json.sha

}

async function salvar(){

try{

const token=document.getElementById("token").value.trim()

if(!token){
alert("Cole o token do GitHub")
return
}

localStorage.setItem("github_token",token)

await pegarSHA(token)

const dados={

titulo:"ZONA CASUAL",

data:data.value,
horario:horario.value,
vagas_total:Number(vagas.value)||0,

sobre:{
texto:sobreTexto.value,
imagem:sobreBase64||""
},

streamers:[
{
nome:streamerNome.value||"@streamer",
foto:streamerBase64||""
}
],

patrocinadores:patros,
times:times

}

const conteudo=btoa(unescape(encodeURIComponent(JSON.stringify(dados,null,2))))

const salvarReq=await fetch(`https://api.github.com/repos/${repo}/contents/${file}`,{

method:"PUT",

headers:{
Authorization:"token "+token,
Accept:"application/vnd.github+json",
"Content-Type":"application/json"
},

body:JSON.stringify({
message:"update dados.json",
content:conteudo,
sha:sha
})

})

const resposta=await salvarReq.json()

if(salvarReq.ok){

alert("Salvo no GitHub com sucesso")

}else{

console.error(resposta)
alert("Erro ao salvar no GitHub")

}

}catch(e){

console.error(e)
alert("Erro ao salvar")

}

}

</script>

</body>
</html>
