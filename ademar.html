<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Painel Admin</title>

<style>

body{
background:#000;
color:#fff;
font-family:Arial;
text-align:center;
padding:20px;
}

input,textarea{
width:90%;
padding:12px;
margin:10px 0;
background:#111;
color:#fff;
border:none;
border-radius:8px;
}

button{
background:#ff8c00;
color:#000;
font-weight:bold;
padding:14px;
border:none;
border-radius:8px;
cursor:pointer;
width:90%;
margin-top:10px;
}

.remover{
background:#c62828;
color:#fff;
}

.card{
background:#111;
padding:20px;
border-radius:10px;
margin-top:20px;
}

img{
max-width:200px;
margin-top:10px;
border-radius:8px;
}

</style>

</head>
<body>

<h1>Painel Admin</h1>

<div id="login">

<input id="senha" placeholder="Senha">
<button onclick="entrar()">Entrar</button>

</div>

<div id="painel" style="display:none">

<div class="card">

<h2>Data e Horário</h2>

<input id="dataEvento" placeholder="Data">
<input id="horaEvento" placeholder="Horário">

</div>

<div class="card">

<h2>Vagas</h2>

<input id="total" placeholder="Vagas totais">
<input id="ocupadas" placeholder="Vagas ocupadas">

</div>

<div class="card">

<h2>Upload Foto Sobre</h2>

<input type="file" id="sobreUpload">
<button onclick="uploadSobre()">UPLOAD</button>

<img id="previewSobre">

</div>

<div class="card">

<h2>Upload Foto Streamer</h2>

<input type="file" id="streamerUpload">
<button onclick="uploadStreamer()">UPLOAD</button>

<img id="previewStreamer">

</div>

<div class="card">

<h2>Upload Foto Admin</h2>

<input type="file" id="adminUpload">
<button onclick="uploadAdmin()">UPLOAD</button>

<img id="previewAdmin">

</div>

<div class="card">

<h2>Texto Sobre</h2>

<textarea id="sobreTexto"></textarea>

</div>

<button class="remover" onclick="removerFotos()">REMOVER TODAS AS FOTOS</button>

<button onclick="salvarGithub()">ALTERAR NO GITHUB</button>

</div>

<script>

let dados={}

function entrar(){

let s=document.getElementById("senha").value

if(s==="1326"){

document.getElementById("login").style.display="none"
document.getElementById("painel").style.display="block"

carregar()

}else{

alert("Senha errada")

}

}

async function carregar(){

let r=await fetch("dados.json")

dados=await r.json()

document.getElementById("dataEvento").value=dados.data
document.getElementById("horaEvento").value=dados.horario

document.getElementById("total").value=dados.vagas_total
document.getElementById("ocupadas").value=dados.vagas_ocupadas

document.getElementById("sobreTexto").value=dados.sobre.texto

document.getElementById("previewSobre").src=dados.sobre.imagem
document.getElementById("previewStreamer").src=dados.streamers[0].foto
document.getElementById("previewAdmin").src=dados.admins[0].foto

}

function uploadSobre(){

let file=document.getElementById("sobreUpload").files[0]

let reader=new FileReader()

reader.onload=function(e){

dados.sobre.imagem=e.target.result

document.getElementById("previewSobre").src=e.target.result

}

reader.readAsDataURL(file)

}

function uploadStreamer(){

let file=document.getElementById("streamerUpload").files[0]

let reader=new FileReader()

reader.onload=function(e){

dados.streamers[0].foto=e.target.result

document.getElementById("previewStreamer").src=e.target.result

}

reader.readAsDataURL(file)

}

function uploadAdmin(){

let file=document.getElementById("adminUpload").files[0]

let reader=new FileReader()

reader.onload=function(e){

dados.admins[0].foto=e.target.result

document.getElementById("previewAdmin").src=e.target.result

}

reader.readAsDataURL(file)

}

function removerFotos(){

dados.sobre.imagem=""
dados.streamers[0].foto=""
dados.admins[0].foto=""

document.getElementById("previewSobre").src=""
document.getElementById("previewStreamer").src=""
document.getElementById("previewAdmin").src=""

alert("Todas as fotos removidas. Agora clique em ALTERAR NO GITHUB.")

}

async function salvarGithub(){

dados.data=document.getElementById("dataEvento").value
dados.horario=document.getElementById("horaEvento").value

dados.vagas_total=parseInt(document.getElementById("total").value)
dados.vagas_ocupadas=parseInt(document.getElementById("ocupadas").value)

dados.sobre.texto=document.getElementById("sobreTexto").value

let conteudo=btoa(unescape(encodeURIComponent(JSON.stringify(dados,null,2))))

let token="SEU_TOKEN_GITHUB"

let repo="sitebrasiilcasual/Modo-Casual"

let path="dados.json"

let r=await fetch("https://api.github.com/repos/"+repo+"/contents/"+path)

let j=await r.json()

await fetch("https://api.github.com/repos/"+repo+"/contents/"+path,{

method:"PUT",

headers:{
Authorization:"token "+token,
"Content-Type":"application/json"
},

body:JSON.stringify({
message:"update dados",
content:conteudo,
sha:j.sha
})

})

alert("SALVO NO GITHUB")

}

</script>

</body>
</html>
