<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin Zona Casual</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
background:#000;
color:#fff;
font-family:Arial;
}

.wrap{
max-width:760px;
margin:auto;
padding:14px;
}

.card{
background:#111;
border:1px solid rgba(255,140,0,.25);
border-radius:14px;
padding:16px;
margin-bottom:14px;
}

h1,h2{
text-align:center;
color:#ff8c00;
margin:0 0 12px;
}

label{
display:block;
margin:10px 0 6px;
font-weight:bold;
}

input,textarea,button{
width:100%;
border:none;
border-radius:10px;
padding:14px;
font-size:16px;
margin-bottom:10px;
}

input,textarea{
background:#1a1a1a;
color:#fff;
}

button{
background:#ff8c00;
color:#000;
font-weight:700;
cursor:pointer;
}

button.sec{
background:#222;
color:#fff;
}

button.red{
background:#8f2b2b;
color:#fff;
}

.grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:10px;
}

.item{
border:1px solid rgba(255,255,255,.08);
border-radius:12px;
padding:12px;
margin-top:10px;
background:#0d0d0d;
}

.preview{
max-width:100px;
border-radius:10px;
display:block;
margin:8px 0;
}

.preview-circle{
width:110px;
height:110px;
border-radius:50%;
object-fit:cover;
display:block;
margin:8px 0;
}

.status{
white-space:pre-wrap;
color:#ccc;
font-size:14px;
}

.login{
position:fixed;
inset:0;
display:flex;
align-items:center;
justify-content:center;
background:#000;
padding:20px;
}

.login-box{
width:100%;
max-width:340px;
background:#111;
border:1px solid rgba(255,140,0,.25);
border-radius:14px;
padding:20px;
}

.count{
text-align:center;
color:#ffb15a;
font-weight:bold;
margin-bottom:12px;
}

@media(max-width:700px){
.grid{grid-template-columns:1fr}
}
</style>
</head>
<body>

<div class="login" id="login">
<div class="login-box">
<h2>Entrar no painel</h2>
<input type="password" id="senha" placeholder="Digite a senha">
<button onclick="entrar()">Entrar</button>
</div>
</div>

<div class="wrap" id="painel" style="display:none">

<h1>Painel Admin</h1>

<div class="card">
<h2>Token GitHub</h2>

<input id="token" placeholder="Cole seu token">

<div class="grid">
<button onclick="salvarToken()">Salvar token</button>
<button class="sec" onclick="usarToken()">Usar token salvo</button>
</div>

</div>

<div class="card">

<label>Título do site</label>
<input id="titulo" value="ZONA CASUAL">

<div class="grid">
<div>
<label>Data</label>
<input type="date" id="dataEvento">
</div>

<div>
<label>Hora</label>
<input type="time" id="horaEvento">
</div>
</div>

<label>Texto sobre</label>
<textarea id="sobre"></textarea>

<label>Foto sobre</label>
<input type="file" accept="image/*"
onchange="up(this,v=>{fotoSobre=v;render();autoSave()})">

<div id="verFotoSobre"></div>

<label>Texto chamada</label>
<textarea id="chamada"></textarea>

</div>

<div class="card">

<h2>Vagas</h2>

<div class="grid">
<div>
<label>Total</label>
<input type="number" id="vagasTotais" oninput="syncVagas()">
</div>

<div>
<label>Disponíveis</label>
<input type="number" id="vagasDisponiveis" oninput="limitarVagas()">
</div>
</div>

<div class="grid">
<div>
<label>Máx participantes</label>
<input type="number" id="maxParticipantes" oninput="syncMax()">
</div>

<div>
<label>Times cadastrados</label>
<input id="totalTimesMostrando" readonly>
</div>
</div>

</div>

<div class="card">

<h2>Streamer principal</h2>

<label>Nome</label>
<input id="spNome">

<label>Link</label>
<input id="spLink">

<label>Foto</label>
<input type="file" accept="image/*"
onchange="up(this,v=>{sp.img=v;render();autoSave()})">

<div id="verSp"></div>

</div>

<div class="card">

<h2>Times</h2>

<div class="count">
Total: <span id="contadorTimes">0</span>
</div>

<button onclick="addTime()">Adicionar time</button>

<div id="times"></div>

</div>

<div class="card">

<h2>Patrocinadores</h2>

<button onclick="addPat()">Adicionar patrocinador</button>

<div id="pats"></div>

</div>

<div class="card">

<h2>Streamers</h2>

<button onclick="addStreamer()">Adicionar streamer</button>

<div id="streamers"></div>

</div>

<div class="card">

<div class="grid">

<button onclick="salvarLocal()">Salvar no aparelho</button>

<button onclick="salvarGithub()">Salvar no GitHub</button>

</div>

<div class="grid">

<button class="sec" onclick="carregarLocal()">Carregar do aparelho</button>

<button class="sec" onclick="carregarGithub()">Carregar do GitHub</button>

</div>

<div class="status" id="status"></div>

</div>

</div>

<script>

const SENHA="zona1326"

const TOKEN_KEY="zc_token"
const SITE_KEY="zc_dados"

const REPO="sitebrasiilcasual/Modo-Casual"
const BRANCH="main"
const PATH="dados.json"

let fotoSobre=""
let times=[]
let pats=[]
let streamers=[]
let sp={nome:"",img:"",link:""}

function entrar(){

if(document.getElementById("senha").value!==SENHA){
alert("Senha incorreta")
return
}

login.style.display="none"
painel.style.display="block"

usarToken()

ativarAutoSave()

carregarAuto()

render()

}

function salvarToken(){
localStorage.setItem(TOKEN_KEY,token.value)
alert("Token salvo")
}

function usarToken(){
token.value=localStorage.getItem(TOKEN_KEY)||""
}

function txt(t){
status.innerText=t
}

function up(inp,cb){
let f=inp.files[0]
if(!f)return
let r=new FileReader()
r.onload=()=>cb(r.result)
r.readAsDataURL(f)
}

function addTime(){
times.push({nome:"Time "+(times.length+1),img:""})
render()
autoSave()
}

function addPat(){
pats.push({nome:"Patrocinador",img:""})
render()
autoSave()
}

function addStreamer(){
streamers.push({nome:"Streamer",img:"",link:""})
render()
autoSave()
}

function del(arr,i){
arr.splice(i,1)
render()
autoSave()
}

function removerFotoSobre(){
fotoSobre=""
render()
autoSave()
}

function removerFotoSp(){
sp.img=""
render()
autoSave()
}

function removerFotoTime(i){
times[i].img=""
render()
autoSave()
}

function removerFotoPat(i){
pats[i].img=""
render()
autoSave()
}

function removerFotoStreamer(i){
streamers[i].img=""
render()
autoSave()
}

function render(){

sp.nome=sp.nome||""
sp.link=sp.link||""

spNome.value=sp.nome
spLink.value=sp.link

verFotoSobre.innerHTML = fotoSobre ?
`
<img src="${fotoSobre}" class="preview">
<button class="red" onclick="removerFotoSobre()">Remover foto</button>
`:""

verSp.innerHTML = sp.img ?
`
<img src="${sp.img}" class="preview-circle">
<button class="red" onclick="removerFotoSp()">Remover foto</button>
`:""

times.innerHTML=times.map((x,i)=>`
<div class="item">

<label>Nome</label>
<input value="${x.nome}" oninput="times[${i}].nome=this.value;autoSave()">

<label>Foto</label>
<input type="file" onchange="up(this,v=>{times[${i}].img=v;render();autoSave()})">

${x.img?`
<img src="${x.img}" class="preview">
<button class="red" onclick="removerFotoTime(${i})">Remover foto</button>
`:""}

<button class="red" onclick="del(times,${i})">Apagar</button>

</div>
`).join("")

pats.innerHTML=pats.map((x,i)=>`
<div class="item">

<label>Nome</label>
<input value="${x.nome}" oninput="pats[${i}].nome=this.value;autoSave()">

<label>Foto</label>
<input type="file" onchange="up(this,v=>{pats[${i}].img=v;render();autoSave()})">

${x.img?`
<img src="${x.img}" class="preview">
<button class="red" onclick="removerFotoPat(${i})">Remover foto</button>
`:""}

<button class="red" onclick="del(pats,${i})">Apagar</button>

</div>
`).join("")

streamers.innerHTML=streamers.map((x,i)=>`
<div class="item">

<label>Nome</label>
<input value="${x.nome}" oninput="streamers[${i}].nome=this.value;autoSave()">

<label>Link</label>
<input value="${x.link}" oninput="streamers[${i}].link=this.value;autoSave()">

<label>Foto</label>
<input type="file" onchange="up(this,v=>{streamers[${i}].img=v;render();autoSave()})">

${x.img?`
<img src="${x.img}" class="preview">
<button class="red" onclick="removerFotoStreamer(${i})">Remover foto</button>
`:""}

<button class="red" onclick="del(streamers,${i})">Apagar</button>

</div>
`).join("")

contadorTimes.innerText=times.length
totalTimesMostrando.value=times.length

}

function dados(){

return{

titulo:titulo.value,
dataEvento:dataEvento.value,
horaEvento:horaEvento.value,
sobre:sobre.value,
fotoSobre:fotoSobre,
chamada:chamada.value,

vagasTotais:+vagasTotais.value||0,
vagasDisponiveis:+vagasDisponiveis.value||0,
maxParticipantes:+maxParticipantes.value||0,

streamerPrincipal:sp,

times:times,
patrocinadores:pats,
streamers:streamers

}

}

function aplicar(d){

titulo.value=d.titulo||""
dataEvento.value=d.dataEvento||""
horaEvento.value=d.horaEvento||""
sobre.value=d.sobre||""
fotoSobre=d.fotoSobre||""
chamada.value=d.chamada||""

vagasTotais.value=d.vagasTotais||0
vagasDisponiveis.value=d.vagasDisponiveis||0
maxParticipantes.value=d.maxParticipantes||0

sp=d.streamerPrincipal||{nome:"",img:"",link:""}

times=d.times||[]
pats=d.patrocinadores||[]
streamers=d.streamers||[]

render()

}

function autoSave(){
localStorage.setItem(SITE_KEY,JSON.stringify(dados()))
}

function salvarLocal(){
autoSave()
alert("Salvo no aparelho")
}

function carregarLocal(){

let r=localStorage.getItem(SITE_KEY)

if(!r)return

aplicar(JSON.parse(r))

}

async function carregarAuto(){

let r=localStorage.getItem(SITE_KEY)

if(r){
aplicar(JSON.parse(r))
}

await carregarGithub(true)

}

async function sha(token){

let r=await fetch(`https://api.github.com/repos/${REPO}/contents/${PATH}?ref=${BRANCH}`,{
headers:{Authorization:"token "+token}
})

if(r.status===404)return null

return (await r.json()).sha

}

async function salvarGithub(){

let t=token.value.trim()

if(!t){
alert("Coloque o token GitHub")
return
}

txt("Salvando...")

try{

let d=dados()

localStorage.setItem(SITE_KEY,JSON.stringify(d))

let s=await sha(t)

let c=btoa(unescape(encodeURIComponent(JSON.stringify(d,null,2))))

let r=await fetch(`https://api.github.com/repos/${REPO}/contents/${PATH}`,{

method:"PUT",

headers:{
Authorization:"token "+t,
"Content-Type":"application/json"
},

body:JSON.stringify({
message:"Atualizar dados",
content:c,
branch:BRANCH,
sha:s
})

})

if(r.ok){
txt("Salvo no GitHub")
await carregarGithub(true)
}
else{
txt(await r.text())
}

}catch(e){

txt(e.message)

}

}

async function carregarGithub(silencioso=false){

if(!silencioso)txt("Carregando...")

try{

let r=await fetch(`https://raw.githubusercontent.com/${REPO}/${BRANCH}/${PATH}?t=`+Date.now(),{
cache:"no-store"
})

if(!r.ok)return

let j=await r.json()

aplicar(j)

localStorage.setItem(SITE_KEY,JSON.stringify(j))

if(!silencioso)txt("Dados carregados")

}catch(e){
txt(e.message)
}

}

function ativarAutoSave(){

document.querySelectorAll("input,textarea").forEach(el=>{
el.addEventListener("input",autoSave)
})

}

</script>

</body>
</html>
