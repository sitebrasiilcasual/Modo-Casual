<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin Zona Casual</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;
  background:#000;
  color:#fff;
  font-family:Arial,sans-serif;
}
.container{
  max-width:900px;
  margin:auto;
  padding:20px;
}
.card{
  background:#111;
  border:1px solid rgba(255,140,0,.28);
  border-radius:14px;
  padding:18px;
  margin-bottom:18px;
  box-shadow:0 0 0 1px rgba(255,140,0,.05),0 10px 30px rgba(0,0,0,.35);
}
h1{
  text-align:center;
  color:#ff8c00;
  margin:0 0 18px;
}
h2{
  color:#ff8c00;
  margin:0 0 14px;
  text-align:center;
}
label{
  display:block;
  margin:8px 0 6px;
  color:#ffb86a;
  font-size:14px;
}
input,textarea,button{
  width:100%;
  padding:12px;
  margin-top:6px;
  margin-bottom:10px;
  border:none;
  border-radius:10px;
  font-size:16px;
}
input,textarea{
  background:#1a1a1a;
  color:#fff;
  outline:none;
  border:1px solid rgba(255,255,255,.06);
}
textarea{
  min-height:100px;
  resize:vertical;
}
button{
  background:#ff8c00;
  color:#000;
  font-weight:bold;
  cursor:pointer;
}
button.sec{
  background:#232323;
  color:#fff;
  border:1px solid rgba(255,255,255,.08);
}
button.red{
  background:#b63a3a;
  color:#fff;
}
.login{
  position:fixed;
  inset:0;
  background:#000;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
}
.login-box{
  background:#111;
  padding:24px;
  border-radius:14px;
  width:100%;
  max-width:340px;
  border:1px solid rgba(255,140,0,.3);
}
.item{
  border:1px solid rgba(255,255,255,.08);
  padding:12px;
  border-radius:10px;
  margin-top:10px;
  background:#0d0d0d;
}
.actions{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}
.info{
  font-size:13px;
  color:#aaa;
  margin-top:4px;
}
.status{
  font-size:14px;
  color:#bbb;
  margin-top:8px;
  min-height:20px;
  word-break:break-word;
}
.preview{
  max-width:110px;
  border-radius:8px;
  display:block;
  margin:6px 0 8px;
  border:1px solid rgba(255,255,255,.08);
}
hr{
  border:none;
  border-top:1px solid rgba(255,255,255,.08);
  margin:14px 0;
}
.small{
  font-size:12px;
  color:#999;
}
</style>
</head>
<body>

<div class="login" id="login">
  <div class="login-box">
    <h2>Admin Zona Casual</h2>
    <input type="password" id="senha" placeholder="Senha do painel">
    <button onclick="login()">Entrar</button>
  </div>
</div>

<div class="container" id="painel" style="display:none">
  <h1>Painel Admin</h1>

  <div class="card">
    <label>Token GitHub</label>
    <input id="token" placeholder="Cole seu token GitHub">
    <div class="actions">
      <button onclick="salvarTokenLocal()">Salvar token no aparelho</button>
      <button class="sec" onclick="carregarTokenLocal()">Usar token salvo</button>
    </div>
    <div class="actions">
      <button class="red" onclick="apagarTokenLocal()">Apagar token salvo</button>
      <button class="sec" onclick="testarToken()">Testar token</button>
    </div>
    <div class="info">O token fica salvo só neste aparelho, no navegador/app local.</div>
    <div class="small">Repositório: <span id="repoInfo">sitebrasiilcasual/Modo-Casual</span> | Branch: <span id="branchInfo">main</span></div>
  </div>

  <div class="card">
    <label>Título do site</label>
    <input id="titulo" value="ZONA CASUAL">

    <label>Texto Sobre</label>
    <textarea id="sobre">O Zona Casual é um projeto criado para reunir equipes da comunidade em partidas personalizadas de Warzone.</textarea>

    <label>Chamada</label>
    <textarea id="chamada">Aqui você encontra personalizadas estruturadas, participação de streamers e espaço para equipes mostrarem seu nível.</textarea>
  </div>

  <div class="card">
    <h2>Times</h2>
    <button onclick="addTime()">Adicionar Time</button>
    <div id="times"></div>
  </div>

  <div class="card">
    <h2>Patrocinadores</h2>
    <button onclick="addPat()">Adicionar Patrocinador</button>
    <div id="pats"></div>
  </div>

  <div class="card">
    <h2>Streamers</h2>
    <button onclick="addStreamer()">Adicionar Streamer</button>
    <div id="streamers"></div>
  </div>

  <div class="card">
    <div class="actions">
      <button onclick="salvarGithub()">SALVAR NO GITHUB</button>
      <button class="sec" onclick="carregarDadosDoGithub()">CARREGAR DO GITHUB</button>
    </div>
    <div class="status" id="status"></div>
  </div>
</div>

<script>
const SENHA = "zona1326";
const REPO = "sitebrasiilcasual/Modo-Casual";
const BRANCH = "main";
const PATH = "dados.json";
const TOKEN_KEY = "zonaCasualGithubToken";

let times = [];
let pats = [];
let streamers = [];

function login(){
  const senhaDigitada = document.getElementById("senha").value;
  if(senhaDigitada === SENHA){
    document.getElementById("login").style.display = "none";
    document.getElementById("painel").style.display = "block";
    carregarTokenLocal();
    render();
  }else{
    alert("Senha incorreta");
  }
}

function setStatus(msg){
  document.getElementById("status").innerText = msg || "";
}

function salvarTokenLocal(){
  const token = document.getElementById("token").value.trim();
  if(!token){
    alert("Cole o token primeiro");
    return;
  }
  localStorage.setItem(TOKEN_KEY, token);
  setStatus("Token salvo neste aparelho.");
  alert("Token salvo no aparelho");
}

function carregarTokenLocal(){
  const token = localStorage.getItem(TOKEN_KEY) || "";
  if(token){
    document.getElementById("token").value = token;
    setStatus("Token salvo carregado.");
  }else{
    setStatus("Nenhum token salvo neste aparelho.");
  }
}

function apagarTokenLocal(){
  localStorage.removeItem(TOKEN_KEY);
  document.getElementById("token").value = "";
  setStatus("Token salvo removido.");
  alert("Token apagado do aparelho");
}

function getToken(){
  return document.getElementById("token").value.trim();
}

function addTime(){
  times.push({nome:"",img:""});
  render();
}

function addPat(){
  pats.push({nome:"",img:""});
  render();
}

function addStreamer(){
  streamers.push({nome:"",img:"",link:""});
  render();
}

function removerTime(i){
  times.splice(i,1);
  render();
}

function removerPat(i){
  pats.splice(i,1);
  render();
}

function removerStreamer(i){
  streamers.splice(i,1);
  render();
}

function uploadImg(input, callback){
  const file = input.files[0];
  if(!file) return;

  const reader = new FileReader();
  reader.onload = function(){
    callback(reader.result);
    render();
  };
  reader.readAsDataURL(file);
}

function escapeHtml(str){
  return String(str || "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}

function render(){
  const t = document.getElementById("times");
  t.innerHTML = "";
  times.forEach((x,i)=>{
    t.innerHTML += `
      <div class="item">
        <input placeholder="Título do time" value="${escapeHtml(x.nome)}" onchange="times[${i}].nome=this.value">
        <input type="file" accept="image/*" onchange="uploadImg(this,function(img){times[${i}].img=img})">
        ${x.img ? `<img class="preview" src="${x.img}" alt="preview">` : ""}
        <button class="red" onclick="removerTime(${i})">Remover</button>
      </div>
    `;
  });

  const p = document.getElementById("pats");
  p.innerHTML = "";
  pats.forEach((x,i)=>{
    p.innerHTML += `
      <div class="item">
        <input placeholder="Título patrocinador" value="${escapeHtml(x.nome)}" onchange="pats[${i}].nome=this.value">
        <input type="file" accept="image/*" onchange="uploadImg(this,function(img){pats[${i}].img=img})">
        ${x.img ? `<img class="preview" src="${x.img}" alt="preview">` : ""}
        <button class="red" onclick="removerPat(${i})">Remover</button>
      </div>
    `;
  });

  const s = document.getElementById("streamers");
  s.innerHTML = "";
  streamers.forEach((x,i)=>{
    s.innerHTML += `
      <div class="item">
        <input placeholder="Nome streamer" value="${escapeHtml(x.nome)}" onchange="streamers[${i}].nome=this.value">
        <input placeholder="Link stream" value="${escapeHtml(x.link)}" onchange="streamers[${i}].link=this.value">
        <input type="file" accept="image/*" onchange="uploadImg(this,function(img){streamers[${i}].img=img})">
        ${x.img ? `<img class="preview" src="${x.img}" alt="preview">` : ""}
        <button class="red" onclick="removerStreamer(${i})">Remover</button>
      </div>
    `;
  });
}

function utf8ToBase64(str){
  return btoa(unescape(encodeURIComponent(str)));
}

async function githubFetch(url, options){
  const token = getToken();
  if(!token){
    throw new Error("Cole o token GitHub");
  }
  const headers = Object.assign({
    "Authorization":"Bearer " + token,
    "Accept":"application/vnd.github+json"
  }, (options && options.headers) || {});
  const finalOptions = Object.assign({}, options || {}, {headers});
  return fetch(url, finalOptions);
}

async function testarToken(){
  try{
    setStatus("Testando token...");
    const res = await githubFetch("https://api.github.com/repos/" + REPO);
    const data = await res.json();

    if(res.ok){
      setStatus("Token OK. Repositório encontrado.");
      alert("Token funcionando");
    }else{
      setStatus("Erro no token: " + (data.message || "Falha"));
      alert("Erro: " + (data.message || "Falha ao testar token"));
    }
  }catch(e){
    setStatus("Erro: " + e.message);
    alert("Erro: " + e.message);
  }
}

async function pegarShaAtual(){
  const url = "https://api.github.com/repos/" + REPO + "/contents/" + PATH + "?ref=" + BRANCH + "&t=" + Date.now();
  const res = await githubFetch(url, {method:"GET"});
  if(res.status === 404){
    return null;
  }
  const data = await res.json();
  if(!res.ok){
    throw new Error(data.message || "Erro ao buscar SHA");
  }
  return data.sha || null;
}

function montarDados(){
  return {
    titulo: document.getElementById("titulo").value,
    sobre: document.getElementById("sobre").value,
    chamada: document.getElementById("chamada").value,
    times: times,
    patrocinadores: pats,
    streamers: streamers
  };
}

async function salvarGithub(){
  try{
    setStatus("Preparando envio...");
    const token = getToken();

    if(!token){
      alert("Cole o token GitHub");
      return;
    }

    localStorage.setItem(TOKEN_KEY, token);

    const dados = montarDados();
    const content = utf8ToBase64(JSON.stringify(dados, null, 2));

    setStatus("Buscando versão atual do arquivo...");
    const sha = await pegarShaAtual();

    const body = {
      message: "Atualizar dados do site",
      content: content,
      branch: BRANCH
    };

    if(sha){
      body.sha = sha;
    }

    setStatus("Enviando para o GitHub...");
    const res = await githubFetch("https://api.github.com/repos/" + REPO + "/contents/" + PATH, {
      method:"PUT",
      headers:{
        "Content-Type":"application/json"
      },
      body: JSON.stringify(body)
    });

    const data = await res.json();

    if(res.ok){
      setStatus("dados.json atualizado com sucesso.");
      alert("Atualizado no GitHub com sucesso");
    }else{
      setStatus("Erro: " + (data.message || "Falha"));
      alert("Erro: " + (data.message || "Falha ao enviar"));
    }

  }catch(e){
    setStatus("Erro: " + e.message);
    alert("Erro: " + e.message);
    console.log(e);
  }
}

async function carregarDadosDoGithub(){
  try{
    setStatus("Carregando dados do GitHub...");
    const res = await githubFetch("https://api.github.com/repos/" + REPO + "/contents/" + PATH + "?ref=" + BRANCH + "&t=" + Date.now(), {
      method:"GET"
    });
    const data = await res.json();

    if(!res.ok){
      throw new Error(data.message || "Não foi possível carregar dados");
    }

    const conteudo = decodeURIComponent(escape(atob(data.content.replace(/\n/g,""))));
    const json = JSON.parse(conteudo);

    document.getElementById("titulo").value = json.titulo || "";
    document.getElementById("sobre").value = json.sobre || "";
    document.getElementById("chamada").value = json.chamada || "";

    times = Array.isArray(json.times) ? json.times : [];
    pats = Array.isArray(json.patrocinadores) ? json.patrocinadores : [];
    streamers = Array.isArray(json.streamers) ? json.streamers : [];

    render();
    setStatus("Dados carregados do GitHub.");
    alert("Dados carregados");
  }catch(e){
    setStatus("Erro: " + e.message);
    alert("Erro: " + e.message);
  }
}
</script>

</body>
</html>
