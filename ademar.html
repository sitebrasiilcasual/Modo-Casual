<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin Zona Casual</title>

<style>

body{
margin:0;
background:#000;
color:#fff;
font-family:Arial;
}

.container{
max-width:900px;
margin:auto;
padding:20px;
}

.card{
background:#111;
border:1px solid rgba(255,140,0,.3);
border-radius:10px;
padding:20px;
margin-bottom:20px;
}

h1{
text-align:center;
color:#ff8c00;
}

input,textarea,button{
width:100%;
padding:12px;
margin-top:6px;
margin-bottom:10px;
border:none;
border-radius:8px;
}

input,textarea{
background:#1a1a1a;
color:#fff;
}

button{
background:#ff8c00;
color:#000;
font-weight:bold;
cursor:pointer;
}

.login{
position:fixed;
inset:0;
background:#000;
display:flex;
align-items:center;
justify-content:center;
}

.login-box{
background:#111;
padding:30px;
border-radius:10px;
width:300px;
border:1px solid rgba(255,140,0,.3);
}

.item{
border:1px solid rgba(255,255,255,.08);
padding:10px;
border-radius:8px;
margin-top:10px;
}

img{
max-width:90px;
border-radius:6px;
margin-top:5px;
}

</style>

</head>

<body>

<div class="login" id="login">
<div class="login-box">

<h2>Admin Zona Casual</h2>

<input type="password" id="senha" placeholder="Senha">

<button onclick="login()">Entrar</button>

</div>
</div>

<div class="container" id="painel" style="display:none">

<h1>Painel Admin</h1>

<div class="card">

<label>Token GitHub</label>
<input id="token" placeholder="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">

<label>Título do site</label>
<input id="titulo" value="ZONA CASUAL">

<label>Texto Sobre</label>
<textarea id="sobre">O Zona Casual é um projeto criado para reunir equipes da comunidade em partidas personalizadas de Warzone.</textarea>

<label>Chamada</label>
<textarea id="chamada">Aqui você encontra personalizadas estruturadas, participação de streamers e espaço para equipes mostrarem seu nível.</textarea>

</div>

<div class="card">

<h2>Times</h2>

<button onclick="addTime()">Adicionar Time</button>

<div id="times"></div>

</div>

<div class="card">

<h2>Patrocinadores</h2>

<button onclick="addPat()">Adicionar Patrocinador</button>

<div id="pats"></div>

</div>

<div class="card">

<h2>Streamers</h2>

<button onclick="addStreamer()">Adicionar Streamer</button>

<div id="streamers"></div>

</div>

<div class="card">

<button onclick="salvarGithub()">SALVAR NO GITHUB</button>

</div>

</div>

<script>

const SENHA="zona1326"

function login(){

const senhaDigitada=document.getElementById("senha").value

if(senhaDigitada===SENHA){

document.getElementById("login").style.display="none"
document.getElementById("painel").style.display="block"

}else{

alert("Senha incorreta")

}

}

let times=[]
let pats=[]
let streamers=[]

function addTime(){

times.push({nome:"",img:""})

render()

}

function addPat(){

pats.push({nome:"",img:""})

render()

}

function addStreamer(){

streamers.push({nome:"",img:"",link:""})

render()

}

function uploadImg(input,callback){

const file=input.files[0]

if(!file) return

const reader=new FileReader()

reader.onload=function(){

callback(reader.result)

}

reader.readAsDataURL(file)

}

function render(){

const t=document.getElementById("times")

t.innerHTML=""

times.forEach((x,i)=>{

t.innerHTML+=`

<div class="item">

<input placeholder="Título do time"
onchange="times[${i}].nome=this.value">

<input type="file"
onchange="uploadImg(this,(img)=>{times[${i}].img=img})">

<button onclick="times.splice(${i},1);render()">Remover</button>

</div>

`

})

const p=document.getElementById("pats")

p.innerHTML=""

pats.forEach((x,i)=>{

p.innerHTML+=`

<div class="item">

<input placeholder="Título patrocinador"
onchange="pats[${i}].nome=this.value">

<input type="file"
onchange="uploadImg(this,(img)=>{pats[${i}].img=img})">

<button onclick="pats.splice(${i},1);render()">Remover</button>

</div>

`

})

const s=document.getElementById("streamers")

s.innerHTML=""

streamers.forEach((x,i)=>{

s.innerHTML+=`

<div class="item">

<input placeholder="Nome streamer"
onchange="streamers[${i}].nome=this.value">

<input placeholder="Link stream"
onchange="streamers[${i}].link=this.value">

<input type="file"
onchange="uploadImg(this,(img)=>{streamers[${i}].img=img})">

<button onclick="streamers.splice(${i},1);render()">Remover</button>

</div>

`

})

}

async function salvarGithub(){

const token=document.getElementById("token").value

if(!token){

alert("Cole o token GitHub")

return

}

const repo="sitebrasiilcasual/Modo-Casual"

const path="dados.json"

const dados={

titulo:titulo.value,
sobre:sobre.value,
chamada:chamada.value,

times:times,

patrocinadores:pats,

streamers:streamers

}

const content=btoa(JSON.stringify(dados,null,2))

let sha=null

const res=await fetch(`https://api.github.com/repos/${repo}/contents/${path}`,{

headers:{Authorization:`Bearer ${token}`}

})

if(res.ok){

const j=await res.json()

sha=j.sha

}

const body={

message:"Atualizar dados do site",

content:content,

branch:"main"

}

if(sha) body.sha=sha

const put=await fetch(`https://api.github.com/repos/${repo}/contents/${path}`,{

method:"PUT",

headers:{
Authorization:`Bearer ${token}`,
"Content-Type":"application/json"
},

body:JSON.stringify(body)

})

if(put.ok){

alert("dados.json atualizado")

}else{

alert("Erro ao enviar para o GitHub")

}

}

</script>

</body>
</html>
