<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Admin Zona Casual</title>

<style>

*{box-sizing:border-box}

body{
margin:0;
background:#000;
color:#fff;
font-family:Arial,sans-serif
}

.wrap{
max-width:760px;
margin:auto;
padding:14px
}

.card{
background:#111;
border:1px solid rgba(255,140,0,.25);
border-radius:14px;
padding:16px;
margin-bottom:14px
}

h1,h2{
text-align:center;
color:#ff8c00;
margin:0 0 12px
}

label{
display:block;
margin:10px 0 6px;
font-weight:bold
}

input,textarea,button{
width:100%;
border:none;
border-radius:10px;
padding:14px;
font-size:16px;
margin-bottom:10px
}

input,textarea{
background:#1a1a1a;
color:#fff
}

button{
background:#ff8c00;
color:#000;
font-weight:700;
cursor:pointer
}

button.sec{
background:#222;
color:#fff
}

button.red{
background:#8f2b2b;
color:#fff
}

.grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:10px
}

.item{
border:1px solid rgba(255,255,255,.08);
border-radius:12px;
padding:12px;
margin-top:10px;
background:#0d0d0d
}

.preview{
max-width:110px;
max-height:110px;
border-radius:10px;
display:block;
margin:8px 0;
object-fit:cover;
background:#1a1a1a
}

.preview-circle{
width:110px;
height:110px;
border-radius:50%;
object-fit:cover;
display:block;
margin:8px 0;
background:#1a1a1a
}

.count{
text-align:center;
color:#ffb15a;
font-weight:bold;
margin-bottom:12px
}

</style>

</head>

<body>

<div class="wrap">

<h1>Painel Admin</h1>


<div class="card">

<h2>Foto do Sobre</h2>

<input type="file" accept="image/*" onchange="upload(this,'sobre')">

<img id="previewSobre" class="preview">

</div>


<div class="card">

<h2>Streamer principal</h2>

<input id="spNome" placeholder="Nome do streamer">

<input id="spLink" placeholder="Link Twitch">

<input type="file" accept="image/*" onchange="upload(this,'streamer')">

<img id="previewStreamer" class="preview-circle">

</div>


<div class="card">

<h2>Times</h2>

<div class="count">Total de times: <span id="contadorTimes">0</span></div>

<button onclick="addTime()">+ Adicionar time</button>

<div id="times"></div>

</div>


<div class="card">

<h2>Patrocinadores</h2>

<button onclick="addPat()">+ Adicionar patrocinador</button>

<div id="pats"></div>

</div>


<div class="card">

<h2>Streamers extras</h2>

<button onclick="addStreamer()">+ Adicionar streamer</button>

<div id="streamers"></div>

</div>


<div class="card">

<h2>Ações rápidas</h2>

<button class="red" onclick="removerTodasAsFotos()">
REMOVER TODAS AS IMAGENS
</button>

</div>


</div>


<script>

let fotoSobre=""
let fotoStreamer=""

let times=[]
let pats=[]
let streamers=[]

function upload(input,tipo){

const file=input.files[0]

if(!file) return

const reader=new FileReader()

reader.onload=e=>{

if(tipo==="sobre"){

fotoSobre=e.target.result

document.getElementById("previewSobre").src=fotoSobre

}

if(tipo==="streamer"){

fotoStreamer=e.target.result

document.getElementById("previewStreamer").src=fotoStreamer

}

}

reader.readAsDataURL(file)

}



function addTime(){

times.push({nome:"",img:""})

render()

}



function addPat(){

pats.push({nome:"",img:""})

render()

}



function addStreamer(){

streamers.push({nome:"",img:"",link:""})

render()

}



function render(){

document.getElementById("contadorTimes").innerText=times.length

const t=document.getElementById("times")

t.innerHTML=""

times.forEach((x,i)=>{

t.innerHTML+=`
<div class="item">

<input placeholder="Nome do time"
value="${x.nome}"
oninput="times[${i}].nome=this.value">

<input placeholder="Logo do time"
value="${x.img}"
oninput="times[${i}].img=this.value">

<button class="red" onclick="delTime(${i})">
Remover
</button>

</div>
`

})


const p=document.getElementById("pats")

p.innerHTML=""

pats.forEach((x,i)=>{

p.innerHTML+=`
<div class="item">

<input placeholder="Nome patrocinador"
value="${x.nome}"
oninput="pats[${i}].nome=this.value">

<input placeholder="Logo patrocinador"
value="${x.img}"
oninput="pats[${i}].img=this.value">

<button class="red" onclick="delPat(${i})">
Remover
</button>

</div>
`

})


const s=document.getElementById("streamers")

s.innerHTML=""

streamers.forEach((x,i)=>{

s.innerHTML+=`
<div class="item">

<input placeholder="Nome streamer"
value="${x.nome}"
oninput="streamers[${i}].nome=this.value">

<input placeholder="Link streamer"
value="${x.link}"
oninput="streamers[${i}].link=this.value">

<input placeholder="Foto streamer"
value="${x.img}"
oninput="streamers[${i}].img=this.value">

<button class="red" onclick="delStreamer(${i})">
Remover
</button>

</div>
`

})

}



function delTime(i){

times.splice(i,1)

render()

}



function delPat(i){

pats.splice(i,1)

render()

}



function delStreamer(i){

streamers.splice(i,1)

render()

}



function removerTodasAsFotos(){

if(!confirm("Tem certeza que deseja remover TODAS as imagens do site?")) return

fotoSobre=""

fotoStreamer=""

times=times.map(t=>({
nome:t.nome,
img:""
}))

pats=pats.map(p=>({
nome:p.nome,
img:""
}))

streamers=streamers.map(s=>({
nome:s.nome,
img:"",
link:s.link
}))

document.getElementById("previewSobre").src=""

document.getElementById("previewStreamer").src=""

render()

alert("Todas as imagens foram removidas")

}

render()

</script>

</body>
</html>
