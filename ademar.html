<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin Zona Casual</title>

<style>

body{
background:#000;
color:#fff;
font-family:Arial;
text-align:center;
padding:20px;
}

.card{
background:#111;
padding:20px;
border-radius:10px;
margin-top:20px;
}

input,textarea{
width:90%;
padding:12px;
margin:10px 0;
background:#1a1a1a;
border:none;
border-radius:8px;
color:#fff;
}

button{
width:90%;
padding:14px;
border:none;
border-radius:8px;
font-weight:bold;
cursor:pointer;
margin-top:10px;
}

.upload{
background:#ff8c00;
color:#000;
}

.salvar{
background:#ff8c00;
color:#000;
}

.remover{
background:#c62828;
color:#fff;
}

img{
max-width:200px;
margin-top:10px;
border-radius:8px;
}

</style>

</head>
<body>

<h1>Painel Admin</h1>

<div id="login">

<input id="senha" placeholder="Senha">
<button onclick="entrar()">Entrar</button>

</div>

<div id="painel" style="display:none">

<div class="card">
<h2>Token GitHub</h2>
<input id="tokenGithub" placeholder="Cole seu token aqui">
</div>

<div class="card">
<h2>Data e Horário</h2>
<input id="dataEvento" placeholder="Data">
<input id="horaEvento" placeholder="Horário">
</div>

<div class="card">
<h2>Vagas</h2>
<input id="total" placeholder="Vagas totais">
<input id="ocupadas" placeholder="Vagas ocupadas">
</div>

<div class="card">
<h2>Texto Sobre</h2>
<textarea id="textoSobre" placeholder="Texto do sobre"></textarea>
</div>

<div class="card">

<h2>Upload Foto Sobre</h2>

<input type="file" id="sobreUpload">
<button class="upload" onclick="uploadSobre()">UPLOAD</button>

<img id="previewSobre">

</div>

<div class="card">

<h2>Upload Foto Streamer</h2>

<input type="file" id="streamerUpload">
<button class="upload" onclick="uploadStreamer()">UPLOAD</button>

<img id="previewStreamer">

</div>

<div class="card">

<h2>Upload Foto Admin</h2>

<input type="file" id="adminUpload">
<button class="upload" onclick="uploadAdmin()">UPLOAD</button>

<img id="previewAdmin">

</div>

<button class="remover" onclick="removerFotos()">REMOVER TODAS AS FOTOS</button>

<button class="salvar" onclick="salvarDados()">ALTERAR NO GITHUB</button>

</div>

<script>

let dados={
data:"",
horario:"",
vagas_total:20,
vagas_ocupadas:0,

sobre:{
texto:"",
imagem:""
},

streamers:[
{nome:"Streamer",foto:""}
],

admins:[
{nome:"Admin",foto:""}
]
}

function entrar(){

let s=document.getElementById("senha").value

if(s==="1326"){

document.getElementById("login").style.display="none"
document.getElementById("painel").style.display="block"

}

else{

alert("Senha errada")

}

}

async function uploadGithub(file,nome){

let token=document.getElementById("tokenGithub").value

let repo="sitebrasiilcasual/Modo-Casual"

let reader=new FileReader()

reader.onload=async function(e){

let base64=e.target.result.split(",")[1]

await fetch("https://api.github.com/repos/"+repo+"/contents/imagens/"+nome,{

method:"PUT",

headers:{
Authorization:"token "+token,
"Content-Type":"application/json"
},

body:JSON.stringify({

message:"upload imagem",
content:base64

})

})

alert("Imagem enviada para GitHub")

}

reader.readAsDataURL(file)

}

function uploadSobre(){

let file=document.getElementById("sobreUpload").files[0]

uploadGithub(file,"sobre.png")

dados.sobre.imagem="imagens/sobre.png"

document.getElementById("previewSobre").src="imagens/sobre.png"

}

function uploadStreamer(){

let file=document.getElementById("streamerUpload").files[0]

uploadGithub(file,"streamer.png")

dados.streamers[0].foto="imagens/streamer.png"

document.getElementById("previewStreamer").src="imagens/streamer.png"

}

function uploadAdmin(){

let file=document.getElementById("adminUpload").files[0]

uploadGithub(file,"admin.png")

dados.admins[0].foto="imagens/admin.png"

document.getElementById("previewAdmin").src="imagens/admin.png"

}

function removerFotos(){

dados.sobre.imagem=""
dados.streamers[0].foto=""
dados.admins[0].foto=""

document.getElementById("previewSobre").src=""
document.getElementById("previewStreamer").src=""
document.getElementById("previewAdmin").src=""

alert("Fotos removidas")

}

async function salvarDados(){

let token=document.getElementById("tokenGithub").value

let repo="sitebrasiilcasual/Modo-Casual"

dados.data=document.getElementById("dataEvento").value
dados.horario=document.getElementById("horaEvento").value

dados.vagas_total=parseInt(document.getElementById("total").value)
dados.vagas_ocupadas=parseInt(document.getElementById("ocupadas").value)

dados.sobre.texto=document.getElementById("textoSobre").value

let conteudo=btoa(unescape(encodeURIComponent(JSON.stringify(dados,null,2))))

let path="dados.json"

let r=await fetch("https://api.github.com/repos/"+repo+"/contents/"+path)

let j=await r.json()

await fetch("https://api.github.com/repos/"+repo+"/contents/"+path,{

method:"PUT",

headers:{
Authorization:"token "+token,
"Content-Type":"application/json"
},

body:JSON.stringify({
message:"update dados",
content:conteudo,
sha:j.sha
})

})

alert("Dados salvos no GitHub")

}

</script>

</body>
</html>
