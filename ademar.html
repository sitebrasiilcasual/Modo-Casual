<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Painel Zona Casual</title>

<style>
*{box-sizing:border-box}
body{background:#000;color:#fff;font-family:Arial;margin:0}
.wrap{max-width:900px;margin:auto;padding:16px}

.card{
background:#111;
border:1px solid rgba(255,140,0,.3);
border-radius:14px;
padding:18px;
margin-bottom:14px
}

h1,h2{text-align:center;color:#ff8c00}

label{display:block;margin-top:10px;margin-bottom:4px;font-weight:bold}

input,textarea{
width:100%;
padding:12px;
border:none;
border-radius:8px;
background:#1c1c1c;
color:#fff
}

button{
width:100%;
padding:12px;
border:none;
border-radius:8px;
background:#ff8c00;
color:#000;
font-weight:bold;
margin-top:10px;
cursor:pointer
}

.preview{
width:100px;
height:100px;
object-fit:cover;
border-radius:10px;
border:2px solid #ff8c00;
margin-top:8px
}

.hidden{display:none}

.login{
max-width:360px;
margin:120px auto
}
</style>
</head>

<body>

<div id="loginBox" class="login card">

<h1>Painel</h1>

<label>Senha</label>
<input id="senha" type="password">

<button onclick="login()">ENTRAR</button>

</div>


<div id="painel" class="wrap hidden">

<div class="card">

<h1>ZONA CASUAL</h1>

<label>Token GitHub</label>
<input id="token">

<button onclick="salvarToken()">Salvar Token</button>

</div>


<div class="card">

<h2>Evento</h2>

<label>Data</label>
<input id="data">

<label>Horário</label>
<input id="horario">

<label>Total vagas</label>
<input id="vagas" type="number">

</div>


<div class="card">

<h2>Sobre</h2>

<textarea id="sobreTexto"></textarea>

<input type="file" id="sobreUpload">

<img id="previewSobre" class="preview">

</div>


<div class="card">

<h2>Streamer</h2>

<input id="streamerNome">

<input type="file" id="streamerUpload">

<img id="previewStreamer" class="preview">

</div>


<div class="card">

<button onclick="salvar()">Salvar no GitHub</button>

</div>

</div>


<script>

const SENHA="1326"
const repo="sitebrasiilcasual/Modo-Casual"
const file="dados.json"
const branch="main"

let sha=""

function login(){

if(senha.value!==SENHA){
alert("senha errada")
return
}

loginBox.classList.add("hidden")
painel.classList.remove("hidden")

token.value=localStorage.getItem("github_token")||""

carregar()

}

function salvarToken(){
localStorage.setItem("github_token",token.value)
alert("token salvo")
}

function preview(input,img){

const f=input.files[0]
if(!f)return

const r=new FileReader()

r.onload=e=>{
img.src=e.target.result
}

r.readAsDataURL(f)

}

sobreUpload.onchange=()=>preview(sobreUpload,previewSobre)
streamerUpload.onchange=()=>preview(streamerUpload,previewStreamer)


async function carregar(){

try{

const res=await fetch("dados.json?t="+Date.now())
const dados=await res.json()

data.value=dados.data||""
horario.value=dados.horario||""
vagas.value=dados.vagas_total||""

sobreTexto.value=dados.sobre?.texto||""
previewSobre.src=dados.sobre?.imagem||""

streamerNome.value=dados.streamers?.[0]?.nome||""
previewStreamer.src=dados.streamers?.[0]?.foto||""

}catch(e){
console.log("dados.json ainda não existe")
}

}


async function pegarSHA(token){

const res=await fetch(`https://api.github.com/repos/${repo}/contents/${file}?ref=${branch}`,{
headers:{
Authorization:`Bearer ${token}`,
Accept:"application/vnd.github+json"
}
})

if(res.status===404){
sha=""
return
}

const json=await res.json()

if(!res.ok){
throw new Error(json.message)
}

sha=json.sha

}


async function salvar(){

try{

const tk=token.value.trim()

if(!tk){
alert("cole o token github")
return
}

await pegarSHA(tk)

const dados={

titulo:"ZONA CASUAL",

data:data.value,
horario:horario.value,
vagas_total:Number(vagas.value)||0,

sobre:{
texto:sobreTexto.value,
imagem:previewSobre.src||""
},

streamers:[
{
nome:streamerNome.value,
foto:previewStreamer.src||""
}
],

patrocinadores:[],
times:[]
}

const conteudo=btoa(unescape(encodeURIComponent(JSON.stringify(dados,null,2))))

const body={
message:"update dados.json",
content:conteudo,
branch:branch
}

if(sha){
body.sha=sha
}

const res=await fetch(`https://api.github.com/repos/${repo}/contents/${file}`,{

method:"PUT",

headers:{
Authorization:`Bearer ${tk}`,
Accept:"application/vnd.github+json",
"Content-Type":"application/json"
},

body:JSON.stringify(body)

})

const json=await res.json()

if(!res.ok){

console.error(json)

alert("Erro GitHub: "+json.message)

return
}

alert("SALVO COM SUCESSO")

}catch(e){

console.error(e)

alert("Erro: "+e.message)

}

}

</script>

</body>
</html>
