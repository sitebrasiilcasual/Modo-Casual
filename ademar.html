<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin Zona Casual</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#000;color:#fff;font-family:Arial}
.wrap{max-width:900px;margin:auto;padding:16px}
.card{background:#111;border:1px solid rgba(255,140,0,.25);border-radius:12px;padding:16px;margin-bottom:14px}
h1,h2{color:#ff8c00;text-align:center}
label{display:block;margin:8px 0 4px}
input,textarea,button{width:100%;padding:12px;border:none;border-radius:8px;margin:5px 0 10px;font-size:15px}
input,textarea{background:#1a1a1a;color:#fff}
button{background:#ff8c00;color:#000;font-weight:700;cursor:pointer}
.sec{background:#222;color:#fff}
.red{background:#8f2b2b;color:#fff}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.item{border:1px solid rgba(255,255,255,.08);padding:10px;border-radius:10px;margin-top:10px}
img{max-width:100px;border-radius:8px;display:block;margin:8px 0;background:#1a1a1a}
.status{font-size:14px;color:#bbb;white-space:pre-wrap}
.login{position:fixed;inset:0;background:#000;display:flex;align-items:center;justify-content:center;padding:20px}
.box{width:100%;max-width:330px;background:#111;border:1px solid rgba(255,140,0,.25);border-radius:12px;padding:20px}
small{color:#999}
.preview-circle{width:120px;height:120px;object-fit:cover;border-radius:50%}
@media(max-width:700px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>

<div class="login" id="login">
  <div class="box">
    <h2>Admin Zona Casual</h2>
    <input type="password" id="senha" placeholder="Senha">
    <button onclick="entrar()">Entrar</button>
  </div>
</div>

<div class="wrap" id="painel" style="display:none">
  <h1>Painel Admin</h1>

  <div class="card">
    <label>Token GitHub</label>
    <input id="token" placeholder="Cole seu token GitHub">
    <div class="grid">
      <button onclick="salvarToken()">Salvar token</button>
      <button class="sec" onclick="usarToken()">Usar token salvo</button>
    </div>
    <small>O token fica salvo só no aparelho.</small>
  </div>

  <div class="card">
    <label>Título do site</label>
    <input id="titulo" value="ZONA CASUAL">

    <div class="grid">
      <div>
        <label>Data do evento</label>
        <input type="date" id="dataEvento" value="2026-03-20">
      </div>
      <div>
        <label>Horário</label>
        <input type="time" id="horaEvento" value="21:00">
      </div>
    </div>

    <label>Texto sobre</label>
    <textarea id="sobre">O Zona Casual é um projeto criado para reunir equipes da comunidade em partidas personalizadas de Warzone.</textarea>

    <label>Foto do sobre</label>
    <input type="file" accept="image/*" onchange="up(this,v=>{fotoSobre=v;render()})">
    <div id="verFotoSobre"></div>

    <label>Texto de chamada</label>
    <textarea id="chamada">Aqui você encontra personalizadas estruturadas, participação de streamers e espaço para equipes mostrarem seu nível.</textarea>
  </div>

  <div class="card">
    <h2>Vagas e Times</h2>

    <div class="grid">
      <div>
        <label>Vagas totais</label>
        <input type="number" id="vagasTotais" value="100" min="0" oninput="syncVagas()">
      </div>
      <div>
        <label>Vagas disponíveis</label>
        <input type="number" id="vagasDisponiveis" value="100" min="0" oninput="limitarVagas()">
      </div>
    </div>

    <div class="grid">
      <div>
        <label>Máximo de participantes</label>
        <input type="number" id="maxParticipantes" value="100" min="0" oninput="syncMax()">
      </div>
      <div>
        <label>Número de times</label>
        <input type="number" id="numeroTimes" value="10" min="0" onchange="ajustarTimes()">
      </div>
    </div>
  </div>

  <div class="card">
    <h2>Streamer principal</h2>
    <label>Nome</label>
    <input id="spNome" value="@StreamerOficial">
    <label>Link</label>
    <input id="spLink" value="https://twitch.tv/">
    <label>Foto</label>
    <input type="file" accept="image/*" onchange="up(this,v=>{sp.img=v;render()})">
    <div id="verSp"></div>
  </div>

  <div class="card">
    <h2>Times</h2>
    <button type="button" onclick="addTime()">Adicionar time</button>
    <div id="times"></div>
  </div>

  <div class="card">
    <h2>Patrocinadores</h2>
    <button type="button" onclick="addPat()">Adicionar patrocinador</button>
    <div id="pats"></div>
  </div>

  <div class="card">
    <h2>Streamers extras</h2>
    <button type="button" onclick="addStreamer()">Adicionar streamer</button>
    <div id="streamers"></div>
  </div>

  <div class="card">
    <div class="grid">
      <button onclick="salvarLocal()">SALVAR NO APARELHO</button>
      <button onclick="salvarGithub()">SALVAR NO GITHUB</button>
    </div>
    <div class="grid">
      <button class="sec" onclick="carregarLocal()">CARREGAR DO APARELHO</button>
      <button class="sec" onclick="carregarGithub()">CARREGAR DO GITHUB</button>
    </div>
    <div class="status" id="status"></div>
  </div>
</div>

<script>
const SENHA="zona1326"
const TOKEN_KEY="zc_token"
const SITE_KEY="zc_dados"
const REPO="sitebrasiilcasual/Modo-Casual"
const BRANCH="main"
const PATH="dados.json"

let fotoSobre=""
let times=[]
let pats=[]
let streamers=[]
let sp={nome:"",img:"",link:""}

function entrar(){
  if(document.getElementById("senha").value.trim()!==SENHA)return alert("Senha incorreta")
  document.getElementById("login").style.display="none"
  document.getElementById("painel").style.display="block"
  usarToken()
  carregarAuto()
  render()
}

function salvarToken(){
  localStorage.setItem(TOKEN_KEY,document.getElementById("token").value.trim())
  alert("Token salvo")
}

function usarToken(){
  document.getElementById("token").value=localStorage.getItem(TOKEN_KEY)||""
}

function txt(t){
  document.getElementById("status").innerText=t||""
}

function esc(s){
  return String(s||"")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
}

function up(inp,cb){
  let f=inp.files[0]
  if(!f)return
  let r=new FileReader()
  r.onload=()=>cb(r.result)
  r.readAsDataURL(f)
}

function syncVagas(){
  document.getElementById("maxParticipantes").value=document.getElementById("vagasTotais").value
  limitarVagas()
}

function syncMax(){
  document.getElementById("vagasTotais").value=document.getElementById("maxParticipantes").value
  limitarVagas()
}

function limitarVagas(){
  let t=+document.getElementById("vagasTotais").value||0
  let d=+document.getElementById("vagasDisponiveis").value||0
  if(d<0)d=0
  if(d>t)d=t
  document.getElementById("vagasDisponiveis").value=d
}

function ajustarTimes(){
  let n=+document.getElementById("numeroTimes").value||0
  while(times.length<n)times.push({nome:"Time "+(times.length+1),img:""})
  while(times.length>n)times.pop()
  render()
}

function addTime(){
  times.push({nome:"Time "+(times.length+1),img:""})
  document.getElementById("numeroTimes").value=times.length
  render()
}

function addPat(){
  pats.push({nome:"Patrocinador",img:""})
  render()
}

function addStreamer(){
  streamers.push({nome:"Streamer",img:"",link:"https://twitch.tv/"})
  render()
}

function del(arr,i){
  arr.splice(i,1)
  if(arr===times)document.getElementById("numeroTimes").value=times.length
  render()
}

function render(){
  sp.nome=sp.nome||""
  sp.link=sp.link||""

  document.getElementById("spNome").value=sp.nome
  document.getElementById("spLink").value=sp.link

  document.getElementById("verFotoSobre").innerHTML = fotoSobre ? `
    <img src="${fotoSobre}">
    <button type="button" class="red" onclick="fotoSobre='';render()">Remover foto</button>
  ` : ""

  document.getElementById("verSp").innerHTML = sp.img ? `
    <img src="${sp.img}" class="preview-circle">
    <button type="button" class="red" onclick="sp.img='';render()">Remover foto</button>
  ` : ""

  document.getElementById("times").innerHTML = times.map((x,i)=>`
    <div class="item">
      <label>Nome do time</label>
      <input value="${esc(x.nome)}" onchange="times[${i}].nome=this.value">

      <label>Foto</label>
      <input type="file" accept="image/*" onchange="up(this,v=>{times[${i}].img=v;render()})">

      ${x.img ? `
        <img src="${x.img}">
        <button type="button" class="red" onclick="times[${i}].img='';render()">Remover foto</button>
      ` : ""}

      <button type="button" class="red" onclick="del(times,${i})">Remover time</button>
    </div>
  `).join("")

  document.getElementById("pats").innerHTML = pats.map((x,i)=>`
    <div class="item">
      <label>Nome do patrocinador</label>
      <input value="${esc(x.nome)}" onchange="pats[${i}].nome=this.value">

      <label>Imagem</label>
      <input type="file" accept="image/*" onchange="up(this,v=>{pats[${i}].img=v;render()})">

      ${x.img ? `
        <img src="${x.img}">
        <button type="button" class="red" onclick="pats[${i}].img='';render()">Remover foto</button>
      ` : ""}

      <button type="button" class="red" onclick="del(pats,${i})">Remover patrocinador</button>
    </div>
  `).join("")

  document.getElementById("streamers").innerHTML = streamers.map((x,i)=>`
    <div class="item">
      <label>Nome do streamer</label>
      <input value="${esc(x.nome)}" onchange="streamers[${i}].nome=this.value">

      <label>Link</label>
      <input value="${esc(x.link)}" onchange="streamers[${i}].link=this.value">

      <label>Foto</label>
      <input type="file" accept="image/*" onchange="up(this,v=>{streamers[${i}].img=v;render()})">

      ${x.img ? `
        <img src="${x.img}">
        <button type="button" class="red" onclick="streamers[${i}].img='';render()">Remover foto</button>
      ` : ""}

      <button type="button" class="red" onclick="del(streamers,${i})">Remover streamer</button>
    </div>
  `).join("")
}

function dados(){
  sp.nome=document.getElementById("spNome").value
  sp.link=document.getElementById("spLink").value
  limitarVagas()

  let total=+document.getElementById("vagasTotais").value||0
  let disp=+document.getElementById("vagasDisponiveis").value||0
  let ocupadas=Math.max(0,total-disp)

  return{
    titulo:document.getElementById("titulo").value,
    dataEvento:document.getElementById("dataEvento").value,
    horaEvento:document.getElementById("horaEvento").value,
    sobre:document.getElementById("sobre").value,
    fotoSobre:fotoSobre,
    chamada:document.getElementById("chamada").value,
    vagasTotais:total,
    vagasDisponiveis:disp,
    maxParticipantes:total,
    numeroTimes:+document.getElementById("numeroTimes").value||0,
    inscricao:{
      totalVagas:total,
      vagasOcupadas:ocupadas,
      times:[]
    },
    streamerPrincipal:sp,
    times:times,
    patrocinadores:pats,
    streamers:streamers
  }
}

function aplicar(d){
  document.getElementById("titulo").value=d.titulo||""
  document.getElementById("dataEvento").value=d.dataEvento||""
  document.getElementById("horaEvento").value=d.horaEvento||""
  document.getElementById("sobre").value=d.sobre||""
  fotoSobre=d.fotoSobre||""
  document.getElementById("chamada").value=d.chamada||""

  let total=d.inscricao?.totalVagas ?? d.vagasTotais ?? d.maxParticipantes ?? 0
  let ocupadas=d.inscricao?.vagasOcupadas ?? 0
  let disponiveis=d.vagasDisponiveis ?? Math.max(0,total-ocupadas)

  document.getElementById("vagasTotais").value=total
  document.getElementById("vagasDisponiveis").value=disponiveis
  document.getElementById("maxParticipantes").value=total
  document.getElementById("numeroTimes").value=d.numeroTimes||d.times?.length||0

  sp=d.streamerPrincipal||{nome:"",img:"",link:""}
  times=Array.isArray(d.times)?d.times:[]
  pats=Array.isArray(d.patrocinadores)?d.patrocinadores:[]
  streamers=Array.isArray(d.streamers)?d.streamers:[]

  ajustarTimes()
  limitarVagas()
  render()
}

function salvarLocal(){
  localStorage.setItem(SITE_KEY,JSON.stringify(dados()))
  alert("Salvo no aparelho")
}

function carregarLocal(){
  let r=localStorage.getItem(SITE_KEY)
  if(r)aplicar(JSON.parse(r))
}

function carregarAuto(){
  let r=localStorage.getItem(SITE_KEY)
  if(r)aplicar(JSON.parse(r))
}

async function sha(token){
  let r=await fetch(`https://api.github.com/repos/${REPO}/contents/${PATH}?ref=${BRANCH}`,{
    headers:{Authorization:"token "+token,Accept:"application/vnd.github+json"}
  })
  if(!r.ok){
    if(r.status===404)return null
    throw new Error(await r.text())
  }
  return (await r.json()).sha||null
}

async function salvarGithub(){
  let t=document.getElementById("token").value.trim()
  if(!t)return alert("Coloque o token GitHub")
  txt("Salvando no GitHub...")
  try{
    let s=await sha(t)
    let c=btoa(unescape(encodeURIComponent(JSON.stringify(dados(),null,2))))
    let r=await fetch(`https://api.github.com/repos/${REPO}/contents/${PATH}`,{
      method:"PUT",
      headers:{
        Authorization:"token "+t,
        "Content-Type":"application/json",
        Accept:"application/vnd.github+json"
      },
      body:JSON.stringify({message:"Atualizar dados.json",content:c,branch:BRANCH,sha:s})
    })
    if(r.ok)txt("✅ Dados enviados para o GitHub")
    else txt("❌ "+await r.text())
  }catch(e){
    txt("Erro: "+e.message)
  }
}

async function carregarGithub(){
  txt("Carregando do GitHub...")
  try{
    let r=await fetch(`https://raw.githubusercontent.com/${REPO}/${BRANCH}/${PATH}?t=`+Date.now())
    if(!r.ok)return txt("❌ Não foi possível carregar")
    aplicar(await r.json())
    txt("✅ Dados carregados do GitHub")
  }catch(e){
    txt("Erro: "+e.message)
  }
}
</script>
</body>
</html>
