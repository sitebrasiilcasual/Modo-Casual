<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin Zona Casual</title>

<style>
*{box-sizing:border-box}
body{
margin:0;
background:#000;
color:#fff;
font-family:Arial,sans-serif;
}
.container{
max-width:900px;
margin:auto;
padding:20px;
}
.card{
background:#111;
border:1px solid rgba(255,140,0,.25);
border-radius:12px;
padding:18px;
margin-bottom:18px;
}
h1,h2{
text-align:center;
color:#ff8c00;
}
label{
display:block;
margin-top:8px;
margin-bottom:4px;
}
input,textarea,button{
width:100%;
padding:12px;
margin:6px 0 10px;
border:none;
border-radius:8px;
font-size:16px;
}
input,textarea{
background:#1a1a1a;
color:#fff;
}
button{
background:#ff8c00;
color:#000;
font-weight:bold;
cursor:pointer;
}
button.sec{
background:#222;
color:#fff;
border:1px solid rgba(255,255,255,.08);
}
button.red{
background:#9f2e2e;
color:#fff;
}
.login{
position:fixed;
inset:0;
background:#000;
display:flex;
align-items:center;
justify-content:center;
padding:20px;
}
.login-box{
background:#111;
padding:25px;
border-radius:12px;
width:100%;
max-width:320px;
border:1px solid rgba(255,140,0,.25);
}
.item{
border:1px solid rgba(255,255,255,.08);
padding:10px;
border-radius:8px;
margin-top:10px;
}
.preview{
max-width:100px;
border-radius:8px;
display:block;
margin:8px 0;
}
.grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:10px;
}
.status{
font-size:14px;
color:#aaa;
min-height:20px;
}
</style>
</head>

<body>

<div class="login" id="login">
<div class="login-box">
<h2>Admin Zona Casual</h2>
<input type="password" id="senha" placeholder="Senha">
<button onclick="entrarPainel()">Entrar</button>
</div>
</div>

<div class="container" id="painel" style="display:none">

<h1>Painel Admin</h1>

<div class="card">

<label>Token GitHub</label>
<input id="token" placeholder="Cole seu token GitHub">

<div class="grid">
<button onclick="salvarToken()">Salvar token</button>
<button class="sec" onclick="usarToken()">Usar token salvo</button>
</div>

</div>

<div class="card">

<label>Título do site</label>
<input id="titulo" value="ZONA CASUAL">

<label>Data do Evento</label>
<input type="date" id="dataEvento">

<label>Horário do Evento</label>
<input type="time" id="horaEvento">

<label>Texto Sobre</label>
<textarea id="sobre"></textarea>

<label>Chamada</label>
<textarea id="chamada"></textarea>

</div>

<div class="card">

<h2>Times</h2>
<button onclick="addTime()">Adicionar Time</button>
<div id="times"></div>

</div>

<div class="card">

<h2>Patrocinadores</h2>
<button onclick="addPat()">Adicionar Patrocinador</button>
<div id="pats"></div>

</div>

<div class="card">

<h2>Streamers Extras</h2>
<button onclick="addStreamer()">Adicionar Streamer</button>
<div id="streamers"></div>

</div>

<div class="card">

<div class="grid">
<button onclick="salvarNoSite()">SALVAR NO SITE</button>
<button onclick="salvarGithub()">SALVAR NO GITHUB</button>
</div>

<div class="grid">
<button class="sec" onclick="carregarDoSite()">CARREGAR DO SITE</button>
<button class="sec" onclick="carregarDoGithub()">CARREGAR DO GITHUB</button>
</div>

<div class="status" id="status"></div>

</div>

</div>

<script>

const SENHA="zona1326"
const TOKEN_KEY="zc_token"
const SITE_KEY="zc_dados"

const REPO="sitebrasiilcasual/Modo-Casual"
const BRANCH="main"
const PATH="dados.json"

let times=[]
let pats=[]
let streamers=[]

function entrarPainel(){
const s=document.getElementById("senha").value.trim()
if(s===SENHA){
document.getElementById("login").style.display="none"
document.getElementById("painel").style.display="block"
usarToken()
render()
}else{
alert("Senha incorreta")
}
}

function statusTxt(t){
document.getElementById("status").innerText=t
}

function salvarToken(){
const t=document.getElementById("token").value.trim()
localStorage.setItem(TOKEN_KEY,t)
alert("Token salvo")
}

function usarToken(){
document.getElementById("token").value=localStorage.getItem(TOKEN_KEY)||""
}

function addTime(){
times.push({nome:""})
render()
}

function addPat(){
pats.push({nome:""})
render()
}

function addStreamer(){
streamers.push({nome:"",link:""})
render()
}

function render(){

let h=""

times.forEach((x,i)=>{
h+=`
<div class="item">
<input value="${x.nome||""}" onchange="times[${i}].nome=this.value">
<button class="red" onclick="times.splice(${i},1);render()">Remover</button>
</div>`
})

document.getElementById("times").innerHTML=h

h=""
pats.forEach((x,i)=>{
h+=`
<div class="item">
<input value="${x.nome||""}" onchange="pats[${i}].nome=this.value">
<button class="red" onclick="pats.splice(${i},1);render()">Remover</button>
</div>`
})

document.getElementById("pats").innerHTML=h

h=""
streamers.forEach((x,i)=>{
h+=`
<div class="item">
<input value="${x.nome||""}" onchange="streamers[${i}].nome=this.value">
<input value="${x.link||""}" onchange="streamers[${i}].link=this.value">
<button class="red" onclick="streamers.splice(${i},1);render()">Remover</button>
</div>`
})

document.getElementById("streamers").innerHTML=h

}

function dados(){
return{
titulo:document.getElementById("titulo").value,
dataEvento:document.getElementById("dataEvento").value,
horaEvento:document.getElementById("horaEvento").value,
sobre:document.getElementById("sobre").value,
chamada:document.getElementById("chamada").value,
times:times,
patrocinadores:pats,
streamers:streamers
}
}

function salvarNoSite(){
localStorage.setItem(SITE_KEY,JSON.stringify(dados()))
alert("Salvo no site")
}

function carregarDoSite(){
const raw=localStorage.getItem(SITE_KEY)
if(!raw)return
const d=JSON.parse(raw)
document.getElementById("titulo").value=d.titulo||""
document.getElementById("dataEvento").value=d.dataEvento||""
document.getElementById("horaEvento").value=d.horaEvento||""
document.getElementById("sobre").value=d.sobre||""
document.getElementById("chamada").value=d.chamada||""
times=d.times||[]
pats=d.patrocinadores||[]
streamers=d.streamers||[]
render()
}

async function salvarGithub(){

const token=document.getElementById("token").value.trim()
if(!token){alert("Coloque o token GitHub");return}

statusTxt("Salvando no GitHub...")

let sha=null

const r=await fetch(`https://api.github.com/repos/${REPO}/contents/${PATH}?ref=${BRANCH}`)
if(r.ok){
const j=await r.json()
sha=j.sha
}

const conteudo=btoa(unescape(encodeURIComponent(JSON.stringify(dados(),null,2))))

await fetch(`https://api.github.com/repos/${REPO}/contents/${PATH}`,{
method:"PUT",
headers:{
"Authorization":"token "+token,
"Content-Type":"application/json"
},
body:JSON.stringify({
message:"Atualizar dados.json",
content:conteudo,
branch:BRANCH,
sha:sha
})
})

statusTxt("Dados enviados para o GitHub")

}

async function carregarDoGithub(){

statusTxt("Carregando do GitHub...")

const r=await fetch(`https://raw.githubusercontent.com/${REPO}/${BRANCH}/${PATH}?t=`+Date.now())
const d=await r.json()

document.getElementById("titulo").value=d.titulo||""
document.getElementById("dataEvento").value=d.dataEvento||""
document.getElementById("horaEvento").value=d.horaEvento||""
document.getElementById("sobre").value=d.sobre||""
document.getElementById("chamada").value=d.chamada||""

times=d.times||[]
pats=d.patrocinadores||[]
streamers=d.streamers||[]

render()

statusTxt("Dados carregados")

}

</script>

</body>
</html>
