<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin Zona Casual</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;
  background:#000;
  color:#fff;
  font-family:Arial,sans-serif;
}
.container{
  max-width:900px;
  margin:auto;
  padding:20px;
}
.card{
  background:#111;
  border:1px solid rgba(255,140,0,.25);
  border-radius:12px;
  padding:18px;
  margin-bottom:18px;
}
h1,h2{
  text-align:center;
  color:#ff8c00;
}
label{
  display:block;
  margin-top:8px;
  margin-bottom:4px;
}
input,textarea,button{
  width:100%;
  padding:12px;
  margin:6px 0 10px;
  border:none;
  border-radius:8px;
  font-size:16px;
}
input,textarea{
  background:#1a1a1a;
  color:#fff;
}
button{
  background:#ff8c00;
  color:#000;
  font-weight:bold;
  cursor:pointer;
}
button.sec{
  background:#222;
  color:#fff;
  border:1px solid rgba(255,255,255,.08);
}
button.red{
  background:#9f2e2e;
  color:#fff;
}
.login{
  position:fixed;
  inset:0;
  background:#000;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
}
.login-box{
  background:#111;
  padding:25px;
  border-radius:12px;
  width:100%;
  max-width:320px;
  border:1px solid rgba(255,140,0,.25);
}
.item{
  border:1px solid rgba(255,255,255,.08);
  padding:10px;
  border-radius:8px;
  margin-top:10px;
}
.preview{
  max-width:100px;
  border-radius:8px;
  display:block;
  margin:8px 0;
}
.preview-sobre{
  width:100%;
  max-width:260px;
  border-radius:10px;
  display:block;
  margin:10px 0;
  border:1px solid rgba(255,255,255,.08);
}
.preview-streamer{
  width:120px;
  height:120px;
  object-fit:cover;
  border-radius:50%;
  display:block;
  margin:10px 0;
  border:2px solid rgba(255,140,0,.35);
  background:#1a1a1a;
}
.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}
.status{
  font-size:14px;
  color:#aaa;
  word-break:break-word;
  min-height:20px;
}
small{
  color:#999;
}
@media(max-width:700px){
  .grid{
    grid-template-columns:1fr;
  }
}
</style>
</head>
<body>

<div class="login" id="login">
  <div class="login-box">
    <h2>Admin Zona Casual</h2>
    <input type="password" id="senha" placeholder="Senha">
    <button onclick="entrarPainel()">Entrar</button>
  </div>
</div>

<div class="container" id="painel" style="display:none">
  <h1>Painel Admin</h1>

  <div class="card">
    <label>Token GitHub</label>
    <input id="token" placeholder="Cole seu token GitHub">
    <div class="grid">
      <button onclick="salvarToken()">Salvar token</button>
      <button class="sec" onclick="usarToken()">Usar token salvo</button>
    </div>
    <small>O token fica salvo só no seu aparelho.</small>
  </div>

  <div class="card">
    <label>Título do site</label>
    <input id="titulo" value="ZONA CASUAL">

    <label>Texto Sobre</label>
    <textarea id="sobre">O Zona Casual é um projeto criado para reunir equipes da comunidade em partidas personalizadas de Warzone.</textarea>

    <label>Foto do Sobre</label>
    <input type="file" id="fotoSobreInput" accept="image/*" onchange="uploadFotoSobre(this)">
    <img id="fotoSobrePreview" class="preview-sobre" style="display:none">

    <label>Chamada</label>
    <textarea id="chamada">Aqui você encontra personalizadas estruturadas, participação de streamers e espaço para equipes mostrarem seu nível.</textarea>
  </div>

  <div class="card">
    <h2>Streamer Principal</h2>

    <label>Nome do streamer</label>
    <input id="streamerNomePrincipal" placeholder="Ex: @nomedostreamer">

    <label>Link clicável do botão da stream</label>
    <input id="streamerLinkPrincipal" placeholder="Ex: https://twitch.tv/nomedostreamer">

    <label>Foto do streamer</label>
    <input type="file" id="streamerImgInput" accept="image/*" onchange="uploadStreamerPrincipal(this)">
    <img id="streamerPreview" class="preview-streamer" style="display:none">

    <small>Isso altera o nome, a foto e o link do botão “Assistir Stream” no site.</small>
  </div>

  <div class="card">
    <h2>Configuração da Inscrição</h2>

    <label>Número máximo de participantes</label>
    <input type="number" id="maxParticipantes" min="1" value="100" placeholder="Ex: 100">

    <label>Número de times</label>
    <input type="number" id="numeroTimes" min="1" value="10" placeholder="Ex: 10">
  </div>

  <div class="card">
    <h2>Times</h2>
    <button onclick="addTime()">Adicionar Time</button>
    <div id="times"></div>
  </div>

  <div class="card">
    <h2>Patrocinadores</h2>
    <button onclick="addPat()">Adicionar Patrocinador</button>
    <div id="pats"></div>
  </div>

  <div class="card">
    <h2>Streamers Extras</h2>
    <button onclick="addStreamer()">Adicionar Streamer</button>
    <div id="streamers"></div>
  </div>

  <div class="card">
    <div class="grid">
      <button onclick="salvarNoSite()">SALVAR NO SITE</button>
      <button onclick="salvarGithub()">SALVAR NO GITHUB</button>
    </div>
    <div class="grid">
      <button class="sec" onclick="carregarDoSite()">CARREGAR DO SITE</button>
      <button class="sec" onclick="carregarDoGithub()">CARREGAR DO GITHUB</button>
    </div>
    <div class="status" id="status"></div>
  </div>
</div>

<script>
const SENHA = "zona1326";
const TOKEN_KEY = "zc_token";
const SITE_KEY = "zc_dados";
const REPO = "sitebrasiilcasual/Modo-Casual";
const BRANCH = "main";
const PATH = "dados.json";

let times = [];
let pats = [];
let streamers = [];
let fotoSobre = "";
let streamerPrincipal = {
  nome: "",
  img: "",
  link: ""
};

function entrarPainel(){
  const senhaDigitada = document.getElementById("senha").value.trim();

  if(senhaDigitada === SENHA){
    document.getElementById("login").style.display = "none";
    document.getElementById("painel").style.display = "block";
    usarToken();
    carregarDoSiteAuto();
    render();
  }else{
    alert("Senha incorreta");
  }
}

function statusTxt(t){
  document.getElementById("status").innerText = t || "";
}

function salvarToken(){
  const t = document.getElementById("token").value.trim();
  if(!t){
    alert("Cole o token primeiro");
    return;
  }
  localStorage.setItem(TOKEN_KEY, t);
  statusTxt("Token salvo no aparelho.");
  alert("Token salvo");
}

function usarToken(){
  const t = localStorage.getItem(TOKEN_KEY) || "";
  if(t){
    document.getElementById("token").value = t;
    statusTxt("Token carregado.");
  }
}

function addTime(){
  times.push({nome:"",img:""});
  render();
}

function addPat(){
  pats.push({nome:"",img:""});
  render();
}

function addStreamer(){
  streamers.push({nome:"",img:"",link:""});
  render();
}

function uploadImg(input, cb){
  const file = input.files[0];
  if(!file) return;

  const r = new FileReader();
  r.onload = function(){
    cb(r.result);
    render();
  };
  r.readAsDataURL(file);
}

function uploadFotoSobre(input){
  const file = input.files[0];
  if(!file) return;

  const r = new FileReader();
  r.onload = function(){
    fotoSobre = r.result;
    atualizarPreviewFotoSobre();
    statusTxt("Foto do sobre alterada.");
  };
  r.readAsDataURL(file);
}

function uploadStreamerPrincipal(input){
  const file = input.files[0];
  if(!file) return;

  const r = new FileReader();
  r.onload = function(){
    streamerPrincipal.img = r.result;
    atualizarPreviewStreamer();
    statusTxt("Foto do streamer alterada.");
  };
  r.readAsDataURL(file);
}

function atualizarPreviewFotoSobre(){
  const img = document.getElementById("fotoSobrePreview");
  if(fotoSobre){
    img.src = fotoSobre;
    img.style.display = "block";
  }else{
    img.src = "";
    img.style.display = "none";
  }
}

function atualizarPreviewStreamer(){
  const img = document.getElementById("streamerPreview");
  if(streamerPrincipal.img){
    img.src = streamerPrincipal.img;
    img.style.display = "block";
  }else{
    img.src = "";
    img.style.display = "none";
  }
}

function esc(v){
  return String(v || "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;");
}

function render(){
  document.getElementById("streamerNomePrincipal").value = streamerPrincipal.nome || "";
  document.getElementById("streamerLinkPrincipal").value = streamerPrincipal.link || "";

  atualizarPreviewFotoSobre();
  atualizarPreviewStreamer();

  let h = "";
  times.forEach(function(x,i){
    h += `
      <div class="item">
        <input placeholder="Título do time" value="${esc(x.nome)}" onchange="times[${i}].nome=this.value">
        <input type="file" accept="image/*" onchange="uploadImg(this,function(img){times[${i}].img=img})">
        ${x.img ? `<img class="preview" src="${x.img}">` : ""}
        <button class="red" onclick="times.splice(${i},1);render()">Remover</button>
      </div>
    `;
  });
  document.getElementById("times").innerHTML = h;

  h = "";
  pats.forEach(function(x,i){
    h += `
      <div class="item">
        <input placeholder="Título patrocinador" value="${esc(x.nome)}" onchange="pats[${i}].nome=this.value">
        <input type="file" accept="image/*" onchange="uploadImg(this,function(img){pats[${i}].img=img})">
        ${x.img ? `<img class="preview" src="${x.img}">` : ""}
        <button class="red" onclick="pats.splice(${i},1);render()">Remover</button>
      </div>
    `;
  });
  document.getElementById("pats").innerHTML = h;

  h = "";
  streamers.forEach(function(x,i){
    h += `
      <div class="item">
        <input placeholder="Nome streamer extra" value="${esc(x.nome)}" onchange="streamers[${i}].nome=this.value">
        <input placeholder="Link streamer extra" value="${esc(x.link)}" onchange="streamers[${i}].link=this.value">
        <input type="file" accept="image/*" onchange="uploadImg(this,function(img){streamers[${i}].img=img})">
        ${x.img ? `<img class="preview" src="${x.img}">` : ""}
        <button class="red" onclick="streamers.splice(${i},1);render()">Remover</button>
      </div>
    `;
  });
  document.getElementById("streamers").innerHTML = h;
}

function dados(){
  streamerPrincipal.nome = document.getElementById("streamerNomePrincipal").value;
  streamerPrincipal.link = document.getElementById("streamerLinkPrincipal").value;

  return {
    titulo: document.getElementById("titulo").value,
    sobre: document.getElementById("sobre").value,
    fotoSobre: fotoSobre,
    chamada: document.getElementById("chamada").value,
    maxParticipantes: Number(document.getElementById("maxParticipantes").value) || 0,
    numeroTimes: Number(document.getElementById("numeroTimes").value) || 0,
    streamerPrincipal: streamerPrincipal,
    times: times,
    patrocinadores: pats,
    streamers: streamers
  };
}

function aplicarDados(d){
  document.getElementById("titulo").value = d.titulo || "";
  document.getElementById("sobre").value = d.sobre || "";
  fotoSobre = d.fotoSobre || "";
  document.getElementById("chamada").value = d.chamada || "";
  document.getElementById("maxParticipantes").value = d.maxParticipantes || "";
  document.getElementById("numeroTimes").value = d.numeroTimes || "";

  streamerPrincipal = d.streamerPrincipal || {
    nome: "",
    img: "",
    link: ""
  };

  times = Array.isArray(d.times) ? d.times : [];
  pats = Array.isArray(d.patrocinadores) ? d.patrocinadores : [];
  streamers = Array.isArray(d.streamers) ? d.streamers : [];

  render();
}

function salvarNoSite(){
  localStorage.setItem(SITE_KEY, JSON.stringify(dados()));
  statusTxt("Dados salvos no site/aparelho.");
  alert("Salvo no site");
}

function carregarDoSite(){
  const raw = localStorage.getItem(SITE_KEY);
  if(!raw){
    alert("Nenhum dado salvo no site");
    return;
  }
  const d = JSON.parse(raw);
  aplicarDados(d);
  statusTxt("Dados carregados do site/aparelho.");
  alert("Dados carregados do site");
}

function carregarDoSiteAuto(){
  const raw = localStorage.getItem(SITE_KEY);
  if(!raw) return;
  try{
    aplicarDados(JSON.parse(raw));
    statusTxt("Dados locais carregados.");
  }catch(e){}
}

function b64utf8(str){
  return btoa(unescape(encodeURIComponent(str)));
}

async function gh(url,opt){
  const t = document.getElementById("token").value.trim();
  if(!t) throw new Error("Cole o token GitHub");

  localStorage.setItem(TOKEN_KEY, t);

  opt = opt || {};
  opt.headers = Object.assign({
    "Authorization":"Bearer " + t,
    "Accept":"application/vnd.github+json"
  }, opt.headers || {});

  return fetch(url, opt);
}

async function salvarGithub(){
  try{
    statusTxt("Buscando arquivo atual...");

    const jsonStr = JSON.stringify(dados(), null, 2);
    const content = b64utf8(jsonStr);
    let sha = null;

    const getRes = await gh("https://api.github.com/repos/" + REPO + "/contents/" + PATH + "?ref=" + BRANCH + "&t=" + Date.now());

    if(getRes.ok){
      const getData = await getRes.json();
      sha = getData.sha;
    }

    statusTxt("Enviando ao GitHub...");

    const body = {
      message:"Atualizar dados do site",
      content:content,
      branch:BRANCH
    };

    if(sha) body.sha = sha;

    const put = await gh("https://api.github.com/repos/" + REPO + "/contents/" + PATH, {
      method:"PUT",
      headers:{
        "Content-Type":"application/json"
      },
      body:JSON.stringify(body)
    });

    const resp = await put.json();

    if(put.ok){
      statusTxt("dados.json atualizado no GitHub.");
      alert("Salvo no GitHub");
    }else{
      statusTxt("Erro: " + (resp.message || "falha"));
      alert("Erro: " + (resp.message || "falha"));
    }
  }catch(e){
    statusTxt("Erro: " + e.message);
    alert("Erro: " + e.message);
  }
}

async function carregarDoGithub(){
  try{
    statusTxt("Carregando do GitHub...");

    const res = await gh("https://api.github.com/repos/" + REPO + "/contents/" + PATH + "?ref=" + BRANCH + "&t=" + Date.now());
    const data = await res.json();

    if(!res.ok){
      throw new Error(data.message || "Falha");
    }

    const txt = decodeURIComponent(escape(atob((data.content || "").replace(/\n/g,""))));
    aplicarDados(JSON.parse(txt));
    statusTxt("Dados carregados do GitHub.");
    alert("Dados carregados do GitHub");
  }catch(e){
    statusTxt("Erro: " + e.message);
    alert("Erro: " + e.message);
  }
}
</script>
</body>
</html>
