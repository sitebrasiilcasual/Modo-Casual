<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin Zona Casual</title>

<style>

body{
background:#000;
color:#fff;
font-family:Arial;
margin:0;
padding:20px
}

.card{
background:#111;
border:1px solid rgba(255,140,0,.25);
border-radius:12px;
padding:20px;
margin-bottom:20px
}

h1,h2{
color:#ff8c00;
text-align:center
}

input,button{
width:100%;
padding:12px;
margin-top:10px;
border:none;
border-radius:8px
}

input{
background:#1a1a1a;
color:#fff
}

button{
background:#ff8c00;
font-weight:bold;
cursor:pointer
}

button.red{
background:#8f2b2b;
color:#fff
}

.login{
position:fixed;
inset:0;
display:flex;
align-items:center;
justify-content:center;
background:#000
}

.login-box{
background:#111;
padding:20px;
border-radius:12px;
border:1px solid rgba(255,140,0,.25);
width:300px
}

.preview{
width:110px;
border-radius:10px;
margin-top:10px
}

</style>
</head>

<body>


<!-- LOGIN -->

<div class="login" id="login">

<div class="login-box">

<h2>Entrar no painel</h2>

<input type="password" id="senha" placeholder="Digite a senha">

<button onclick="entrar()">Entrar</button>

</div>

</div>



<!-- PAINEL -->

<div id="painel" style="display:none">

<h1>Painel Admin</h1>

<div class="card">

<h2>GitHub</h2>

<input id="token" placeholder="Token GitHub">

<button onclick="salvarGithub()">SALVAR NO GITHUB</button>

<button onclick="carregarGithub()">CARREGAR DO GITHUB</button>

</div>


<div class="card">

<h2>Foto do Sobre</h2>

<input type="file" accept="image/*" onchange="upload(this,'sobre')">

<img id="previewSobre" class="preview">

</div>


<div class="card">

<h2>Streamer principal</h2>

<input id="spNome" placeholder="Nome streamer">

<input id="spLink" placeholder="Link Twitch">

<input type="file" accept="image/*" onchange="upload(this,'streamer')">

<img id="previewStreamer" class="preview">

</div>


<div class="card">

<h2>Times</h2>

<button onclick="addTime()">Adicionar time</button>

<div id="times"></div>

</div>


<div class="card">

<h2>Patrocinadores</h2>

<button onclick="addPat()">Adicionar patrocinador</button>

<div id="pats"></div>

</div>


<div class="card">

<h2>Ações rápidas</h2>

<button class="red" onclick="removerTodasAsFotos()">

REMOVER TODAS AS IMAGENS

</button>

</div>

</div>



<script>

const SENHA="1326"

const REPO="sitebrasilcasual/Modo-Casual"
const BRANCH="main"
const PATH="dados.json"


let fotoSobre=""
let fotoStreamer=""

let times=[]
let pats=[]



function entrar(){

const senhaDigitada=document.getElementById("senha").value

if(senhaDigitada!==SENHA){

alert("Senha incorreta")

return

}

document.getElementById("login").style.display="none"
document.getElementById("painel").style.display="block"

}



function upload(input,tipo){

const file=input.files[0]

if(!file) return

const reader=new FileReader()

reader.onload=e=>{

if(tipo==="sobre"){

fotoSobre=e.target.result
document.getElementById("previewSobre").src=fotoSobre

}

if(tipo==="streamer"){

fotoStreamer=e.target.result
document.getElementById("previewStreamer").src=fotoStreamer

}

}

reader.readAsDataURL(file)

}



function addTime(){

times.push({nome:"",img:""})
render()

}



function addPat(){

pats.push({nome:"",img:""})
render()

}



function render(){

const t=document.getElementById("times")

t.innerHTML=""

times.forEach((x,i)=>{

t.innerHTML+=`

<div class="card">

<input placeholder="Nome do time"
value="${x.nome}"
oninput="times[${i}].nome=this.value">

<input placeholder="Logo do time"
value="${x.img}"
oninput="times[${i}].img=this.value">

<button class="red" onclick="delTime(${i})">Remover</button>

</div>

`

})


const p=document.getElementById("pats")

p.innerHTML=""

pats.forEach((x,i)=>{

p.innerHTML+=`

<div class="card">

<input placeholder="Nome patrocinador"
value="${x.nome}"
oninput="pats[${i}].nome=this.value">

<input placeholder="Logo patrocinador"
value="${x.img}"
oninput="pats[${i}].img=this.value">

<button class="red" onclick="delPat(${i})">Remover</button>

</div>

`

})

}



function delTime(i){

times.splice(i,1)
render()

}



function delPat(i){

pats.splice(i,1)
render()

}



function removerTodasAsFotos(){

if(!confirm("Remover todas as imagens do site?")) return

fotoSobre=""
fotoStreamer=""

times=times.map(t=>({nome:t.nome,img:""}))
pats=pats.map(p=>({nome:p.nome,img:""}))

document.getElementById("previewSobre").src=""
document.getElementById("previewStreamer").src=""

render()

alert("Todas as imagens foram removidas")

}



function dados(){

return{

fotoSobre:fotoSobre,

streamerPrincipal:{
nome:document.getElementById("spNome").value,
link:document.getElementById("spLink").value,
img:fotoStreamer
},

times:times,
patrocinadores:pats

}

}



async function salvarGithub(){

const token=document.getElementById("token").value.trim()

if(!token){

alert("Coloque o token GitHub")
return

}

const url=`https://api.github.com/repos/${REPO}/contents/${PATH}`

let sha=""

try{

const r=await fetch(url)

if(r.ok){

const j=await r.json()
sha=j.sha

}

}catch(e){}



const content=btoa(unescape(encodeURIComponent(JSON.stringify(dados(),null,2))))

const body={
message:"Atualizando dados do site",
content:content,
branch:BRANCH
}

if(sha) body.sha=sha


const r=await fetch(url,{
method:"PUT",
headers:{
Authorization:`Bearer ${token}`,
"Content-Type":"application/json"
},
body:JSON.stringify(body)
})

const j=await r.json()

if(j.commit){

alert("Dados salvos no GitHub")

}else{

alert("Erro ao salvar")
console.log(j)

}

}



async function carregarGithub(){

const token=document.getElementById("token").value.trim()

if(!token){

alert("Coloque o token GitHub")
return

}

const r=await fetch(
`https://api.github.com/repos/${REPO}/contents/${PATH}`,
{
headers:{Authorization:`Bearer ${token}`}
})

const j=await r.json()

const dados=JSON.parse(atob(j.content))

fotoSobre=dados.fotoSobre||""
fotoStreamer=dados.streamerPrincipal?.img||""

times=dados.times||[]
pats=dados.patrocinadores||[]

document.getElementById("previewSobre").src=fotoSobre
document.getElementById("previewStreamer").src=fotoStreamer

render()

}

render()

</script>

</body>
</html>
