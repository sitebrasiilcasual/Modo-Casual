<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Painel Zona Casual</title>

<style>

*{box-sizing:border-box}

body{
background:#000;
color:#fff;
font-family:Arial;
margin:0;
}

.wrap{
max-width:900px;
margin:auto;
padding:16px;
}

.card{
background:#111;
border:1px solid rgba(255,140,0,.3);
border-radius:14px;
padding:18px;
margin-bottom:16px;
}

h1,h2{
text-align:center;
color:#ff8c00;
margin-bottom:14px;
}

label{
display:block;
margin-top:10px;
margin-bottom:4px;
font-weight:bold;
}

input,textarea{
width:100%;
padding:12px;
border:none;
border-radius:8px;
background:#1c1c1c;
color:#fff;
font-size:15px;
}

button{
width:100%;
padding:12px;
border:none;
border-radius:8px;
background:#ff8c00;
color:#000;
font-weight:bold;
margin-top:10px;
cursor:pointer;
}

.preview{
width:100px;
height:100px;
border-radius:10px;
object-fit:cover;
border:2px solid #ff8c00;
margin-top:8px;
}

.item{
background:#181818;
padding:10px;
border-radius:10px;
margin-top:10px;
}

.hidden{display:none}

.login{
max-width:360px;
margin:120px auto;
}

</style>
</head>

<body>

<div id="loginBox" class="login card">

<h1>Painel</h1>

<label>Senha</label>
<input id="senha">

<button onclick="login()">Entrar</button>

</div>

<div id="painel" class="wrap hidden">

<div class="card">

<h1>ZONA CASUAL</h1>

<label>Token GitHub</label>
<input id="token">

<button onclick="salvarToken()">Salvar Token</button>

</div>


<div class="card">

<h2>Evento</h2>

<label>Data</label>
<input id="data">

<label>Horário</label>
<input id="horario">

<label>Total vagas</label>
<input id="vagas">

</div>


<div class="card">

<h2>Sobre</h2>

<textarea id="sobreTexto"></textarea>

<input type="file" id="sobreUpload">

<img id="previewSobre" class="preview">

</div>


<div class="card">

<h2>Streamer</h2>

<input id="streamerNome">

<input type="file" id="streamerUpload">

<img id="previewStreamer" class="preview">

</div>


<div class="card">

<h2>Patrocinadores</h2>

<div id="patros"></div>

<button onclick="addPatro()">Adicionar patrocinador</button>

</div>


<div class="card">

<h2>Times</h2>

<div id="times"></div>

<button onclick="addTime()">Adicionar time</button>

</div>


<div class="card">

<button onclick="salvar()">Salvar no GitHub</button>

</div>

</div>


<script>

const SENHA="1326"
const repo="sitebrasiilcasual/Modo-Casual"
const file="dados.json"
const branch="main"

let dados={}

function login(){

if(document.getElementById("senha").value!==SENHA){

alert("Senha errada")
return

}

document.getElementById("loginBox").classList.add("hidden")
document.getElementById("painel").classList.remove("hidden")

token.value=localStorage.getItem("github_token")||""

carregar()

}

function salvarToken(){
localStorage.setItem("github_token",token.value)
alert("Token salvo")
}

function preview(input,img){

const r=new FileReader()

r.onload=e=>img.src=e.target.result

r.readAsDataURL(input.files[0])

}

sobreUpload.onchange=()=>preview(sobreUpload,previewSobre)
streamerUpload.onchange=()=>preview(streamerUpload,previewStreamer)

async function carregar(){

try{

const res=await fetch("dados.json?t="+Date.now())

dados=await res.json()

data.value=dados.data||""
horario.value=dados.horario||""
vagas.value=dados.vagas_total||""

sobreTexto.value=dados.sobre?.texto||""
previewSobre.src=dados.sobre?.imagem||""

streamerNome.value=dados.streamers?.[0]?.nome||""
previewStreamer.src=dados.streamers?.[0]?.foto||""

renderPatros()
renderTimes()

}catch(e){

dados={patrocinadores:[],times:[]}

}

}

function renderPatros(){

patros.innerHTML=""

;(dados.patrocinadores||[]).forEach((p,i)=>{

patros.innerHTML+=`
<div class="item">
<input value="${p.nome||""}" onchange="dados.patrocinadores[${i}].nome=this.value">
<input type="file" onchange="uploadPatro(${i},this)">
<img class="preview" src="${p.foto||""}">
</div>
`

})

}

function addPatro(){

if(!dados.patrocinadores)dados.patrocinadores=[]

dados.patrocinadores.push({nome:"",foto:""})

renderPatros()

}

function uploadPatro(i,input){

const r=new FileReader()

r.onload=e=>{
dados.patrocinadores[i].foto=e.target.result
renderPatros()
}

r.readAsDataURL(input.files[0])

}

function renderTimes(){

times.innerHTML=""

;(dados.times||[]).forEach((t,i)=>{

times.innerHTML+=`
<div class="item">
<input value="${t.nome||""}" onchange="dados.times[${i}].nome=this.value">
<input type="file" onchange="uploadTime(${i},this)">
<img class="preview" src="${t.foto||""}">
</div>
`

})

}

function addTime(){

if(!dados.times)dados.times=[]

dados.times.push({nome:"",foto:""})

renderTimes()

}

function uploadTime(i,input){

const r=new FileReader()

r.onload=e=>{
dados.times[i].foto=e.target.result
renderTimes()
}

r.readAsDataURL(input.files[0])

}

async function salvar(){

try{

const tk=token.value.trim()

if(!tk){
alert("Cole o token GitHub")
return
}

/* pega SHA atual automaticamente */

const shaReq=await fetch(`https://api.github.com/repos/${repo}/contents/${file}?t=${Date.now()}`,{
headers:{Authorization:`Bearer ${tk}`}
})

let shaAtual=null

if(shaReq.ok){

const shaJson=await shaReq.json()
shaAtual=shaJson.sha

}

/* atualiza dados */

dados.data=data.value
dados.horario=horario.value
dados.vagas_total=Number(vagas.value)

dados.sobre={
texto:sobreTexto.value,
imagem:previewSobre.src
}

dados.streamers=[{
nome:streamerNome.value,
foto:previewStreamer.src
}]

const conteudo=btoa(unescape(encodeURIComponent(JSON.stringify(dados,null,2))))

const body={
message:"update dados.json",
content:conteudo,
branch:branch
}

if(shaAtual) body.sha=shaAtual

const res=await fetch(`https://api.github.com/repos/${repo}/contents/${file}`,{

method:"PUT",

headers:{
Authorization:`Bearer ${tk}`,
"Content-Type":"application/json"
},

body:JSON.stringify(body)

})

const json=await res.json()

if(!res.ok){

alert("Erro GitHub: "+json.message)
return

}

alert("SALVO COM SUCESSO")

}catch(e){

alert("Erro: "+e.message)

}

}

</script>

</body>
</html>
